# ── A real vulnerability with no upstream fix ────────────────────────────────

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2027-03-31
reason = "rsa: Marvin Attack, key recovery through timing side channels (CVSS 5.9). No fixed version exists -- the fix requires a constant-time rewrite upstream. Reached transitively; GIAP does not perform RSA private-key operations on attacker-controlled timing paths. Named in security.yml's own comment. Re-check whether a fixed rsa release exists at the review date."

# ── A fixed version exists, but no lockfile here can reach it ───────────────
#
# The rule above still holds: these are listed only because every crate that pulls zip
# 8 has no release that allows 9, and the vulnerable function is never called.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
ignoreUntil = 2027-01-31
reason = "zip 8.6.0: extract() keeps SUID/SGID/sticky bits from the archive. The fix is zip 9, but candle-core 0.11.0, docx-rs 0.4.22 and umya-spreadsheet 3.1.1 (the latest releases, via goose) all require zip ^8.6.0, so no lockfile here can drop 8.x until they move. The advisory is confined to ZipArchive::extract() and ZipStreamReader::extract(); nothing in this tree calls either. pond-server's model_download.rs reads two named entries by index into fixed paths; goose-cli's update.rs (Windows only) iterates entries through enclosed_name() and writes plain files without applying permissions; none of the three crates calls extract(). Re-check at the review date whether they accept zip 9, then bump and remove this entry."

[[IgnoredVulns]]

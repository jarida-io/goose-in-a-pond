reason = "zip 8.6.0: extract() creates symlinks whose targets point outside the destination. The fix is zip 9, but candle-core 0.11.0, docx-rs 0.4.22 and umya-spreadsheet 3.1.1 (the latest releases, via goose) all require zip ^8.6.0, so no lockfile here can drop 8.x until they move. The advisory is confined to ZipArchive::extract() and ZipStreamReader::extract(); nothing in this tree calls either. pond-server's model_download.rs reads two named entries by index into fixed paths; goose-cli's update.rs (Windows only) iterates entries through enclosed_name() and writes plain files without applying permissions; none of the three crates calls extract(). Re-check at the review date whether they accept zip 9, then bump and remove this entry."


# Reviewed exceptions for osv-scanner.
#
# Every entry here is an advisory that cannot be fixed from this repository:
# either no upstream fix exists, or the fix is a new major that crates we do not
# control have not adopted yet (the zip section says which). Anything this
# lockfile can upgrade away from is deliberately absent: putting it here would
# convert a real finding into a silent one.
#
# `ignoreUntil` is a review date, not a dismissal. When it passes the scanner
# reports the advisory again, which is the point -- an unmaintained crate that
# is still unmaintained a year later is worth re-deciding, not re-ignoring.
#
# Reviewed 2026-09-29. Checked against the scan on jarida-io/goose-in-a-pond
# main at that date; the fixed-version column was empty ("--") for all of them.
# Re-reviewed 2026-10-20 against main a3230b44: negentropy (RUSTSEC-2026-0365)
# was bumped to 0.5.2 rather than ignored; the zbus-family, basic-toml and zip
# entries were added with the blockers stated in each reason.

# ── Unmaintained-crate notices ───────────────────────────────────────────────
#
# RUSTSEC's `unmaintained` category is a maintenance signal, not a defect: there
# is no vulnerable code and no patch to take. They are worth knowing and worth
# migrating off, and none of them is a reason to block a merge today. Each one
# below arrives transitively; none is a direct dependency of this workspace.


# ── Real vulnerabilities whose fix is a major our dependencies have not taken ─

[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
ignoreUntil = 2027-01-31
reason = "zip 8.6.0 preserves SUID/SGID bits in extract(). Patched only in zip 9.0.0; docx-rs 0.4.22 (latest release) and umya-spreadsheet 3.1.1 (latest stable), both via goose-mcp, require zip ^8.6.0 and zip 8 has no patched release, so 8.6.0 stays in the graph although candle-core 0.11.1 has moved to zip 9. Not reachable: nothing in the build calls extract(). pond-server's buffalo_l download (model_download.rs) reads entries with by_index() and writes each to a fixed path chosen by file name; candle-core, docx-rs and umya-spreadsheet only read archives in memory. Remove when docx-rs and umya-spreadsheet move to zip 9."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0368"
ignoreUntil = 2027-01-31
reason = "zip 8.6.0 extract() creates symlinks whose targets leave the destination directory. Same blocker and same non-reachability as RUSTSEC-2026-0367: no code in the build calls extract() or creates symlinks from archive entries."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0369"
ignoreUntil = 2027-01-31
reason = "zip 8.6.0 extract() and ZipStreamReader::extract() apply Unix permissions through symlinks. Same blocker and same non-reachability as RUSTSEC-2026-0367: neither function is called, and pond-server never applies archive permissions."

[[IgnoredVulns]]
id = "GHSA-m665-v7pm-7grj"
ignoreUntil = 2027-01-31
reason = "zip 8.6.0 parser differential ('zip cloaking'): ZipArchive trusts the central directory while ZipStreamReader trusts the local headers, so one archive can name different files to each. Patched only in zip 9.0.5; same blocker as RUSTSEC-2026-0367 (docx-rs 0.4.22 and umya-spreadsheet 3.1.1, their latest stable releases, require zip ^8.6.0). Not reachable: the differential needs both readers on one archive, and nothing in the build uses ZipStreamReader; pond-server's buffalo_l download (model_download.rs) and goose-cli's updater use ZipArchive only."

[[IgnoredVulns]]
id = "GHSA-8hxf-qr8p-62x4"
ignoreUntil = 2027-01-31
reason = "zip 8.6.0 can accept an AES-encrypted entry whose HMAC was never checked when the stream ends early. Patched only in zip 9.0.0; same blocker as RUSTSEC-2026-0367 (docx-rs 0.4.22 and umya-spreadsheet 3.1.1, their latest stable releases, require zip ^8.6.0). Not reachable: AES support is zip's aes-crypto feature, which nothing in GIAP or goose enables (cargo tree -e features -i zip shows only the deflate features)."

[[IgnoredVulns]]
id = "GHSA-9hj8-73fh-9963"
ignoreUntil = 2027-01-31
reason = "zip 8.6.0's legacy Shrink/Reduce/Implode decoder trusts an attacker-controlled ZIP64 size and can exhaust memory. Patched only in zip 9.0.0; same blocker as RUSTSEC-2026-0367 (docx-rs 0.4.22 and umya-spreadsheet 3.1.1, their latest stable releases, require zip ^8.6.0). Not reachable: the legacy decoders are zip's legacy-zip feature, which nothing in GIAP or goose enables; only deflate is compiled in."

[[IgnoredVulns]]
id = "GHSA-hjqx-j4rw-g7xv"
ignoreUntil = 2027-01-31
reason = "zip 8.6.0 ZipArchive::extract() validates symlink targets lexically, so a crafted archive can write outside the destination. Patched only in zip 9.0.0; same blocker as RUSTSEC-2026-0367 (docx-rs 0.4.22 and umya-spreadsheet 3.1.1, their latest stable releases, require zip ^8.6.0). Not reachable: no code in the build calls extract(); pond-server's buffalo_l download (model_download.rs) reads entries with by_index() and writes each to a fixed path chosen by file name."

[[IgnoredVulns]]
id = "GHSA-q7v9-x93c-xqv3"
ignoreUntil = 2027-01-31
reason = "zip 8.6.0 does not bound symlink targets during extraction, so a crafted archive can abort or exhaust memory. Patched only in zip 9.0.0; same blocker as RUSTSEC-2026-0367 (docx-rs 0.4.22 and umya-spreadsheet 3.1.1, their latest stable releases, require zip ^8.6.0). Not reachable: it is in extraction, and no code in the build calls extract() or creates symlinks from archive entries."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "minimatch: a crafted pattern makes firstPhasePreProcess() (optimizationLevel >= 2) multiply its glob parts, which the second phase then compares pairwise. Fixed only in 11.0.1, a new major, with no fix on any earlier line. Every copy (3.1.5, 5.1.9, 9.0.9, 10.2.6) is in pond-desktop's dev tree under eslint and electron-builder; none ships in the app or the server. Their latest releases still require older majors: eslint 10.14.0 (^10.2.6), app-builder-lib 26.18.0 (^10.2.5), @typescript-eslint/typescript-estree 8.72.1 (^10.2.2), dir-compare 5.0.0 (^3.0.5). Not reachable: the patterns are the repo's own lint and packaging globs. npm audit rates it moderate, below that job's high gate. Remove when eslint and electron-builder take minimatch 11."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2027-01-31
reason = "libsqlite3-sys 0.30.1 bundles an SQLite that can return uninitialised page-cache memory when a database is opened beside a crafted -wal file whose page size differs. Fixed in 0.39.0 (SQLite 3.54.0). Not fixable from this lockfile: sqlx-sqlite, through sqlx 0.8.6 (GIAP and goose) and 0.9.0 (its latest release), requires libsqlite3-sys >=0.30.1, <0.38, and the crate's links = sqlite3 allows one copy in the graph. Not reachable: the attacker must write both files where the victim opens them. pond-infra (db.rs, sqlite_vector_index.rs) and goose's session_manager.rs open only databases the server creates in its own data directory, and nothing opens a user-supplied database; whoever can write there already holds the data. Remove when sqlx takes libsqlite3-sys 0.39."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0574"
ignoreUntil = 2027-01-31
reason = "heapless 0.7.17 and 0.8.0: FindMutView::pop after mutating the value is a use after free. Fixed only in 0.9.4, a new major. 0.7.17 comes through postcard 1.1.3 (its latest stable; 2.0 is a release candidate) under frost-core and breez-sdk-spark, so only through pond-adapters-lightning (pond-server's optional `lightning` feature, off by default and absent from the shipped binary). 0.8.0 comes through faster-hex 0.10.1 under nostr 0.45 (0.45.7, its latest, still requires faster-hex ^0.10), which only goose's optional `nostr` feature compiles and GIAP does not enable; also in goose/Cargo.lock. Not reachable: cargo tree -p pond-server -i heapless is empty. Remove when postcard and nostr move to heapless 0.9."


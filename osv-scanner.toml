# Reviewed exceptions for osv-scanner.
#
# Every entry here is an advisory with no fix this tree can take. Anything a
# lockfile here can upgrade away from is deliberately absent: such an advisory
# does not belong in an ignore file, and putting it here would convert a real
# finding into a silent one.
#
# `ignoreUntil` is a review date, not a dismissal. When it passes the scanner
# reports the advisory again, which is the point -- an unmaintained crate that
# is still unmaintained a year later is worth re-deciding, not re-ignoring.
#
# Reviewed 2026-09-29, extended 2026-10-20. Checked against the scan on
# jarida-io/goose-in-a-pond main at those dates. The fixed-version column was
# empty ("--") for every entry except zip, whose section says why its fix is
# out of reach.


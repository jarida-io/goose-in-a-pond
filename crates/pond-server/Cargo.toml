[package]
name = "pond-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "pond-server"
path = "src/main.rs"

[lib]
name = "pond_server"
path = "src/lib.rs"

[features]
default = ["goose-agent", "local-inference"]
# Enable the Goose agent backend (compiles Block's Goose from the submodule — slow first build).
# Enabled by default. To build without Goose: cargo build -p pond-server --no-default-features
goose-agent = ["dep:pond-adapters-goose"]
# Enable the independent PondAgent backend (no Goose dependency, KV-cache reuse).
#
# OFF BY DEFAULT, because the backend it compiles cannot be activated: Q2-05
# quarantines it at both layers (`PUT /api/v1/settings` 422s `agent_backend =
# "pond"`, and `serve()` rewrites it to "goose" before any backend is wired). It
# was in `default` while `scripts/jetson/deploy.sh` and `build-native.sh` built
# with defaults, so every device build compiled ~4.8 kLOC and a second llama.cpp
# cmake unit for a path that cannot run. `build-docker.sh` was already correct.
#
# Turning it back on is a decision about the quarantine, not about the build:
#   cargo build -p pond-server --features pond-agent
pond-agent = ["dep:pond-agent", "dep:pond-inference"]
# Enable the direct mistral.rs backend (`agent_backend = "mistralrs"`).
#
# OFF BY DEFAULT and Mac-only by intent. It compiles a goose-free turn loop that
# talks to a mistral.rs server over its OpenAI-compatible API -- the other end of
# the experiment the goose-hosted "mistralrs" *provider* started. mistral.rs is
# not a Jetson candidate on today's numbers (docs/developer/mistralrs-provider.md),
# so nothing that builds for the device should compile this.
#
#   cargo run -p pond-server --features mistralrs-agent -- serve --agent mistralrs
mistralrs-agent = ["dep:pond-adapters-mistralrs"]
# Enable flat-file MCP memory (memories injected into system prompt every chat turn).
# cargo run -p pond-server --features mcp-memory -- serve
mcp-memory = ["dep:pond-adapters-mcp-memory"]
# Enable in-process GGUF inference (no llamafile/Ollama subprocess required).
# First build compiles llama-cpp-2 + candle — expect 5–15 min.
# cargo run -p pond-server --features local-inference -- chat --provider local
#
# Pulls `pond-inference` too: it hosts the GGUF `EmbeddingProvider`
# (`embedding_provider = "gguf"`), which shares this feature's llama.cpp rather
# than fastembed's ONNX. No extra native compile — llama-cpp-2 is already built
# by this feature and goose-agent.
#
# This used to say fastembed's ONNX "will not initialise on the Jetson Orin".
# That is false, and it was the stated reason the GGUF embedder exists, so it is
# worth saying plainly why. fastembed takes `ort`'s DEFAULT features, which
# include `api-24`; the pinned ONNX Runtime was 1.22.0, which does not expose
# that API level. The failure was a version mismatch that would have happened on
# any host — it was only ever SEEN on the Jetson. Bumping `ORT_VERSION` (see
# `main.rs`) fixed it: the board now holds real 384-dim all-MiniLM-L6-v2 vectors.
#
# So choose the GGUF embedder for the reason above — one llama.cpp instead of two
# runtimes — and not because the alternative is broken on the target.
local-inference = [
    "dep:pond-adapters-local-inference",
    "dep:pond-inference",
    "pond-api/local-inference",
]
# Enable ONNX face recognition (Phase 2 biometric user differentiation).
# Requires the ONNX Runtime shared library to be available at startup
# (set ORT_DYLIB_PATH, or place libonnxruntime in the system library path).
# cargo run -p pond-server --features face-onnx -- serve
face-onnx = ["dep:pond-adapters-face-onnx"]
# Enable the ONNX vision classifier (#130 follow-up): labels motion events
# person/pet/package via YOLOX-Nano. Same ONNX Runtime requirement as
# face-onnx (ORT_DYLIB_PATH). Off = events stay plain "motion".
# cargo run -p pond-server --features vision-onnx -- serve
vision-onnx = ["dep:pond-adapters-vision-onnx"]
# Silero VAD used to be a feature here, off by default, on the grounds that it
# needs a system ONNX Runtime and a default build must not depend on one. That
# reasoning applied to `face-onnx` and `vision-onnx` and was carried over
# without checking: those two link ort at its default features, this one asks
# for `load-dynamic` in its own manifest, so it never links a runtime it cannot
# find — and `ensure_onnx_runtime()` already resolves or downloads the dylib
# before voice starts. The feature only ever gated a build that would have
# worked. Silero is now an ordinary dependency and `chat --voice` uses it.
# There is deliberately no `system-ort` feature here to dlopen the ONNX Runtime
# rather than link it. One was written and reverted: this binary depends on
# pond-infra, pond-infra depends on fastembed, and the root Cargo.toml gives
# fastembed `ort-load-dynamic` — so `ort-sys/disable-linking` is already on in
# every build of pond-server. `cargo tree -p pond-server -e features -i ort`
# resolves the same 17 ort features with and without such a switch; it would
# have promised a change it cannot make.
#
# This does NOT generalise to the adapter crates. `cargo test -p
# pond-adapters-kokoro` on its own has no fastembed in the graph and therefore
# statically links a prebuilt ONNX Runtime — which fails outright on JetPack 6.
# That is what pond-adapters-kokoro's own `system-ort` feature is for; its
# Cargo.toml carries the full note.
# Enable the private mesh transport (#132 Milestone 2): real libp2p
# MeshTransport, gated behind settings.mesh_enabled at runtime. Kept optional
# — full-feature libp2p (kad+gossipsub+relay+dcutr) is a materially heavier
# compile than the rest of the default build.
# cargo run -p pond-server --features mesh -- serve
mesh = ["dep:pond-adapters-mesh-libp2p", "dep:pond-mesh-protocol", "dep:pond-adapters-mesh-inference"]
# Enable Lightning settlement over Breez/Spark (#132 Milestone 5), gated
# behind settings.lightning_enabled at runtime. Kept optional and separate
# from `mesh` — mesh borrowing/lending works without ever settling a real
# balance, and this pulls a heavier, git-pinned SDK dependency.
# cargo run -p pond-server --features "mesh lightning" -- serve
lightning = ["dep:pond-adapters-lightning"]
# `legacy-subprocess` is gone (2026-08). It kept the whisper-server and piper
# subprocess paths compilable as "a one-release escape valve while the
# in-process backends bed in" — several releases ago. It was default-off, never
# built by CI, and its modules (whisper_process, piper_process, piper_http) are
# deleted. The in-process backends are the only path now.
#
# This branch predates that removal and carried the feature back; taking its
# side would have declared a feature whose modules no longer exist.

[dependencies]
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
x509-parser = { version = "0.18", features = ["verify-aws"] }
time = "0.3"
base64 = { workspace = true }
tempfile = { workspace = true }
# Advisory file locking for the single-voice-session guard (voice_lock.rs).
fs2 = { workspace = true }
# Optional: only compiled when --features goose-agent is passed.
pond-adapters-goose           = { path = "../pond-adapters-goose", optional = true }
# Optional: only compiled when --features pond-agent is passed.
pond-agent                    = { path = "../pond-agent", optional = true }
# Optional: only compiled when --features mistralrs-agent is passed.
pond-adapters-mistralrs       = { path = "../pond-adapters-mistralrs", optional = true }
pond-inference                = { path = "../pond-inference", optional = true }
# Optional: only compiled when --features mcp-memory is passed.
pond-adapters-mcp-memory      = { workspace = true, optional = true }
# Optional: only compiled when --features local-inference is passed.
pond-adapters-local-inference = { workspace = true, optional = true }
# Optional: only compiled when --features face-onnx is passed.
pond-adapters-face-onnx       = { workspace = true, optional = true }
# Optional: only compiled when --features vision-onnx is passed.
pond-adapters-vision-onnx     = { workspace = true, optional = true }
# Speech/silence decision for the voice loop; see the note above the features.
pond-adapters-silero          = { workspace = true }
# Optional: only compiled when --features mesh is passed.
pond-adapters-mesh-libp2p     = { workspace = true, optional = true }
pond-mesh-protocol            = { workspace = true, optional = true }
pond-adapters-mesh-inference  = { workspace = true, optional = true }
pond-adapters-lightning       = { workspace = true, optional = true }
# `test-mocks` is required at the NORMAL dependency level (not dev-deps) because
# `main.rs` falls back to `MockAgent` in non-test code paths (the `--agent mock`
# fallback and the `cfg(not(feature = "goose-agent"))` voice-mode wiring).
pond-core              = { workspace = true, features = ["test-mocks"] }
pond-api               = { workspace = true }
pond-hf-cache          = { workspace = true }
pond-infra             = { workspace = true }
pond-infra-scheduler   = { workspace = true }
pond-adapters-vision       = { workspace = true }
pond-adapters-matter       = { workspace = true }
pond-adapters-caldav       = { workspace = true }
rustls                     = { workspace = true }
pond-adapters-imap         = { workspace = true }
pond-adapters-weather      = { workspace = true }
pond-adapters-llamafile = { path = "../../crates/pond-adapters-llamafile" }
pond-adapters-ollama = { path = "../../crates/pond-adapters-ollama" }
pond-adapters-whisper = { path = "../../crates/pond-adapters-whisper" }
# The SpeechDetector trait the composition root hands to the whisper adapter.
pond-voice            = { path = "../../crates/pond-voice" }
pond-adapters-kokoro = { path = "../../crates/pond-adapters-kokoro" }
pond-audio = { path = "../pond-audio" }
cpal = "0.15"
pond-mcp-server    = { path = "../pond-mcp-server" }
# Both depend on the goose submodule which creates a diamond rmcp conflict when
# linked into the workspace build. They are built in isolation:
#   cargo build -p pond-mcp-server
#   cargo build -p pond-adapters-goose
# See crates/pond-mcp-server/ and docs/developer/goose_integrations.md
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
hostname = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio-util = { workspace = true }
# Required to query pond_logs.db directly in the debug log-tail task.
sqlx = { workspace = true }
webbrowser = { workspace = true }
zip = { workspace = true }
flate2 = "1"
tar = "0.4"
url = { workspace = true }
sha2 = "0.10"
mdns-sd = "0.11"
qrcode  = "0.14"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
wiremock   = { workspace = true }
tempfile   = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros"] }
assert_cmd = { workspace = true }
predicates = { workspace = true }
indoc      = { workspace = true }
futures    = { workspace = true }

# getuid(), so the voice lock is per-user rather than per-machine.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

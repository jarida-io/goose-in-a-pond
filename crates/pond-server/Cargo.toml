[package]
name = "pond-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "pond-server"
path = "src/main.rs"

[lib]
name = "pond_server"
path = "src/lib.rs"

[features]
default = ["goose-agent", "local-inference", "pond-agent"]
# The one canonical name for a GPU build. Every script that builds a Jetson
# binary must pass exactly this and nothing else.
#
# It exists because the two adapters have to be enabled together and three of
# the repo's build paths used to enable only the first, producing a binary with
# the LLM on the GPU and ASR silently on six CPU cores. Nothing errored: cargo
# does not warn, the build succeeds, the server starts, transcription still
# works. The only tell was one INFO line nobody asserted on.
#
# Pair it with CMAKE_CUDA_ARCHITECTURES=87 — sm_87 is NOT in ggml's default
# architecture list, and whether the `native` fallback rescues you depends on
# which cmake is first on PATH (3.22 over ssh, 4.x in a login shell), so an
# unpinned build is not reproducible.
#
# `local-inference` is listed explicitly rather than relying on
# `pond-adapters-local-inference/cuda` to pull the optional dep in implicitly:
# that route enables the adapter but NOT `pond-api/local-inference`, which the
# `local-inference` feature also turns on. Under `--no-default-features
# --features cuda` the two would disagree.
cuda = [
    "local-inference",
    "pond-adapters-local-inference/cuda",
    "pond-adapters-whisper/cuda",
]
# Enable the Goose agent backend (compiles Block's Goose from the submodule — slow first build).
# Enabled by default. To build without Goose: cargo build -p pond-server --no-default-features
goose-agent = ["dep:pond-adapters-goose"]
# Enable the independent PondAgent backend (no Goose dependency, KV-cache reuse).
# Use agent_backend="pond" in settings to activate. Requires local-inference feature.
pond-agent = ["dep:pond-agent", "dep:pond-inference"]
# Enable flat-file MCP memory (memories injected into system prompt every chat turn).
# cargo run -p pond-server --features mcp-memory -- serve
mcp-memory = ["dep:pond-adapters-mcp-memory"]
# Enable in-process GGUF inference (no llamafile/Ollama subprocess required).
# First build compiles llama-cpp-2 + candle — expect 5–15 min.
# cargo run -p pond-server --features local-inference -- chat --provider local
local-inference = ["dep:pond-adapters-local-inference", "pond-api/local-inference"]
# Enable ONNX face recognition (Phase 2 biometric user differentiation).
# Requires the ONNX Runtime shared library to be available at startup
# (set ORT_DYLIB_PATH, or place libonnxruntime in the system library path).
# cargo run -p pond-server --features face-onnx -- serve
face-onnx = ["dep:pond-adapters-face-onnx"]
# Enable the ONNX vision classifier (#130 follow-up): labels motion events
# person/pet/package via YOLOX-Nano. Same ONNX Runtime requirement as
# face-onnx (ORT_DYLIB_PATH). Off = events stay plain "motion".
# cargo run -p pond-server --features vision-onnx -- serve
vision-onnx = ["dep:pond-adapters-vision-onnx"]
# `legacy-subprocess` is gone (2026-08). It kept the whisper-server and piper
# subprocess paths compilable as "a one-release escape valve while the
# in-process backends bed in" — several releases ago. It was default-off, never
# built by CI, and its modules (whisper_process, piper_process, piper_http) are
# deleted. The in-process backends are the only path now.

[dependencies]
# Advisory file locking for the single-voice-session guard (voice_lock.rs).
fs2 = { workspace = true }
# Optional: only compiled when --features goose-agent is passed.
pond-adapters-goose           = { path = "../pond-adapters-goose", optional = true }
# Optional: only compiled when --features pond-agent is passed.
pond-agent                    = { path = "../pond-agent", optional = true }
pond-inference                = { path = "../pond-inference", optional = true }
# Optional: only compiled when --features mcp-memory is passed.
pond-adapters-mcp-memory      = { workspace = true, optional = true }
# Optional: only compiled when --features local-inference is passed.
pond-adapters-local-inference = { workspace = true, optional = true }
# Optional: only compiled when --features face-onnx is passed.
pond-adapters-face-onnx       = { workspace = true, optional = true }
# Optional: only compiled when --features vision-onnx is passed.
pond-adapters-vision-onnx     = { workspace = true, optional = true }
# `test-mocks` is required at the NORMAL dependency level (not dev-deps) because
# `main.rs` falls back to `MockAgent` in non-test code paths (the `--agent mock`
# fallback and the `cfg(not(feature = "goose-agent"))` voice-mode wiring).
pond-core              = { workspace = true, features = ["test-mocks"] }
pond-api               = { workspace = true }
pond-hf-cache          = { workspace = true }
pond-infra             = { workspace = true }
pond-infra-scheduler   = { workspace = true }
pond-adapters-vision       = { workspace = true }
pond-adapters-matter       = { workspace = true }
pond-adapters-weather      = { workspace = true }
pond-adapters-llamafile = { path = "../../crates/pond-adapters-llamafile" }
pond-adapters-ollama = { path = "../../crates/pond-adapters-ollama" }
pond-adapters-whisper = { path = "../../crates/pond-adapters-whisper" }
pond-adapters-piper = { path = "../../crates/pond-adapters-piper" }
cpal = "0.15"
pond-mcp-server    = { path = "../pond-mcp-server" }
# Both depend on the goose submodule which creates a diamond rmcp conflict when
# linked into the workspace build. They are built in isolation:
#   cargo build -p pond-mcp-server
#   cargo build -p pond-adapters-goose
# See crates/pond-mcp-server/ and docs/developer/goose_integrations.md
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
dirs = "5.0"
hostname = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio-util = { workspace = true }
# Required to query pond_logs.db directly in the debug log-tail task.
sqlx = { workspace = true }
webbrowser = { workspace = true }
zip = "2"
flate2 = "1"
tar = "0.4"
url = { workspace = true }
sha2 = "0.10"
mdns-sd = "0.11"
qrcode  = "0.14"

[dev-dependencies]
wiremock   = { workspace = true }
tempfile   = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros"] }
assert_cmd = { workspace = true }
predicates = { workspace = true }
indoc      = { workspace = true }
futures    = { workspace = true }

# getuid(), so the voice lock is per-user rather than per-machine.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

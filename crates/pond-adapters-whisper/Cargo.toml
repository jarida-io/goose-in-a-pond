[package]
name = "pond-adapters-whisper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# ── Build note ────────────────────────────────────────────────────────────────
# Default build is CPU-only `whisper-rs`. Hardware acceleration: `--features metal`
# on macOS (auto-enabled below by a target-specific dep entry) or `--features cuda`
# on Jetson.

[features]
default = []
# Enable CUDA kernel compilation for Jetson Orin Nano / NVIDIA GPUs.
cuda = ["whisper-rs/cuda"]
# Enable Metal acceleration on macOS (also auto-enabled on macOS targets via
# the `[target.'cfg(target_os = "macos")']` dependency entry below).
metal = ["whisper-rs/metal"]
# There are no other features. `legacy-subprocess` (the HTTP `WhisperInput`
# posting to whisper-server :9000) was removed in 2026-08 along with
# `reqwest`/`serde_json`; transcription is in-process only.

[dependencies]
pond-voice = { path = "../pond-voice" }
pond-audio = { path = "../pond-audio" }
# The wake ping plays on the same speaker as the voice.
pond-audio-out = { path = "../pond-audio-out" }
pond-core = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# In-process whisper.cpp bindings.
whisper-rs = { version = "0.16", default-features = false, features = ["log_backend"] }

# Auto-enable Metal acceleration on macOS targets so a plain
# `cargo build -p pond-adapters-whisper` on a Mac gets GPU offload.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["log_backend", "metal"] }

[dev-dependencies]
# No `wiremock`: it outlived the HTTP backend it was here to fake by two
# releases, and nothing in `tests/` has started a mock server since.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# `examples/ear_bench.rs`: a recording through the room's front end, scored offline.
pond-ear = { workspace = true }
pond-adapters-ear = { path = "../pond-adapters-ear" }
serde_json = { workspace = true }
# whisper.cpp reports its buffers through `log`; the bench prints them.
log = "0.4"

[package]
name = "pond-mcp-server"
version = "0.1.0"
edition = "2021"
authors = ["Jerry Anyumba <jerry@jarida.io>","Liz Wangui <liz@jarida.io>",
    "Purity Wanjiru <wanjiru@jarida.io>","Emmanuel Oyugi <oyugi@jarida.io>",
    "Africia Kerubo <africia@jarida.io>"]
license = "Apache-2.0"

# 6 modular MCP servers: memory, schedule, weather, knowledge, system, device.
# Each module exposes init_*() / spawn_*() functions for Goose's builtin registry.
# Registration into Goose happens in pond-adapters-goose (giap_registration.rs).
# This crate only needs rmcp (MCP protocol types + macros) and pond-core (port traits).

[dependencies]
pond-core            = { path = "../pond-core" }
pond-net             = { path = "../pond-net" }
pond-adapters-weather = { path = "../pond-adapters-weather" }
# Use rmcp 1.2.0 directly — matches the version used by goose's builtin registry
rmcp       = { workspace = true }
anyhow     = "1.0"
async-trait = "0.1"
# "full" pulled in every tokio feature (net, signal, io-std, macros, sync…)
# for a crate that only touches fs, process spawning, one duplex-pipe pair,
# and a command timeout. Narrowed to what src/*.rs actually calls: fs
# (system.rs file read/write tools), io-util (AsyncWriteExt + the in-memory
# DuplexStream/duplex() every module's rmcp handler uses), process
# (system.rs run_command), rt (tokio::spawn in audit.rs), time (the
# run_command timeout). "sync" (tokio::sync::RwLock, test-only) and "macros"
# (#[tokio::test]) live in [dev-dependencies] instead of being pulled into
# the production feature set.
tokio      = { version = "1.49", features = ["fs", "io-util", "process", "rt", "time"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing    = "0.1"
once_cell  = "1.20"
uuid       = { version = "1.11", features = ["v4"] }
chrono     = { version = "0.4", features = ["serde"] }
chrono-tz  = { workspace = true }
schemars   = { version = "1", features = ["derive"] }
reqwest      = { workspace = true }
urlencoding  = { workspace = true }
sysinfo      = "0.38"
# Phase F3/F5: camera snapshots are handed to the model as MCP image content,
# which the protocol carries base64-encoded.
base64       = { workspace = true }
notify-rust  = "4"
# search_web: fetch pages concurrently in one task, and read them.
futures      = { workspace = true }
# search_web: Readability's class and id patterns. Already in the graph through pond-core.
regex        = { workspace = true }
scraper      = { workspace = true }

[dev-dependencies]
pond-core = { path = "../pond-core", features = ["test-mocks"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync"] }

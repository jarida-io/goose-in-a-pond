[package]
name = "pond-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# Guarantees pond-desktop/dist exists at compile time so include_dir! never fails
# on a fresh checkout (embeds a placeholder until the real UI is built).
build = "build.rs"

[features]
# Enable in-process GGUF inference routing (mirrors pond-server's local-inference feature).
local-inference = ["dep:pond-adapters-local-inference"]
# `test_support::app_state()` for integration tests here and in pond-server.
test-support = ["dep:tempfile", "pond-core/test-mocks", "pond-infra/cpace-client"]

[dependencies]
libc = "0.2"
if-addrs = { version = "0.13", features = ["link-local"] }
pond-adapters-caldav = { workspace = true }
pond-core = { workspace = true }
pond-voice = { path = "../pond-voice" }
pond-hf-cache = { workspace = true }
pond-infra = { workspace = true }
pond-net = { workspace = true }
pond-adapters-llamafile = { workspace = true }
pond-adapters-ollama = { path = "../pond-adapters-ollama" }
pond-adapters-local-inference = { workspace = true, optional = true }
pond-adapters-weather = { workspace = true }
pond-adapters-uber    = { workspace = true }
pond-adapters-vision  = { workspace = true }
# NO `goose` dependency. This crate is the HTTP edge of a hexagonal core and must
# stay framework-free — and it is in CI's "fast crates" list, which is defined as
# the crates that do not pull the submodule. The one former use,
# `Recipe::from_content`, is now `routes.rs :: RecipePrompt`.
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
futures = { workspace = true }
rand = "0.8"
reqwest = { workspace = true, features = ["json", "multipart", "stream"] }
sha2 = "0.10"
base64 = { workspace = true }
# Constant-time comparison of the host credential.
subtle = { workspace = true }
hostname = { workspace = true }
# Re-encoding a WebP picture the engine cannot decode, before the turn is persisted
# (`image_normalize.rs`). The workspace pin is jpeg/png/webp only, and CI's fast pass already
# builds it through pond-adapters-vision.
image = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Already in the tree through goose; its HTML writer is not used, so the export escapes all markup itself.
pulldown-cmark = { version = "0.13", default-features = false }
serde_yaml = { workspace = true }
# One statement, in `rebuild_context_index`: emptying the personal-context index
# so the maintenance sweep refills it. The `VectorIndex` port cannot empty an
# index whose source rows all still exist. Not a new coupling — `AppState.db` is
# already a `pond_infra::db::Database`. A third caller means the port needs this.
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tower = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true, features = ["fs", "cors"] }
uuid = { workspace = true }
urlencoding = { workspace = true }
# Single-executable: embed the built web UI (pond-desktop/dist) into the binary.
include_dir = { workspace = true }
mime_guess = "2"
# Apple Music developer-token signing (`musickit.rs`), shared with the pondcredentials service so
# the two sign identically. It lives in that service's workspace so a Docker build can copy it alone.
pond-apple-token = { path = "../../services/pondcredentials/token" }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
pond-api = { path = ".", features = ["test-support"] }
# Tests only: decoding developer tokens to check what was signed.
jsonwebtoken = { workspace = true }
# Tests only: generate the P-256 key at run time (gitleaks scans history, so no committed PEM).
# Already in the graph as jsonwebtoken's and rustls's crypto backend.
aws-lc-rs = "1"
async-trait = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
# Tests only: capture what a handler logs, to check that no secret reaches the log.
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
pond-adapters-llamafile = { workspace = true }
pond-core = { workspace = true, features = ["test-mocks"] }
uuid = { workspace = true }
# Tests only: seed sensor_readings at chosen timestamps, which `record` cannot
# do because it always stamps datetime('now').
sqlx = { workspace = true }
# Tests only: complete a real handshake the way a phone does, so `/devices/self`
# is exercised with a token the pond issued rather than a hand-built principal.
hmac = { workspace = true }

[package]
name = "pond-audio-out"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The speaker-side counterpart to `pond-audio`: backend-agnostic WAV in, speaker
# out, with the barge-in and turn-generation semantics documented on `play_wav`,
# so a second TTS engine need not copy them. `pond-voice` cannot host it: that
# crate is kept a std-only leaf on purpose, and this one needs rodio.

[dependencies]
pond-core = { workspace = true }
pond-voice = { path = "../pond-voice" }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
# rodio is isolated to this crate — playback must not leak into every crate
# that happens to want to make a sound.
rodio = "0.19"

[dev-dependencies]
pond-ear = { workspace = true }

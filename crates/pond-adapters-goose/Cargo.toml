[package]
name = "pond-adapters-goose"
version = "0.1.0"
edition = "2021"
authors = ["Jerry Anyumba <jerry@jarida.io>","Liz Wangui <liz@jarida.io>",
    "Purity Wanjiru <wanjiru@jarida.io>","Emmanuel Oyugi <oyugi@jarida.io>",
    "Africia Kerubo <africia@jarida.io>"]
license = "Apache-2.0"

# This crate is intentionally excluded from the GIAP workspace — it depends on
# the goose submodule with all features, which pulls in rmcp version conflicts.
# Build in isolation: cargo build --manifest-path crates/pond-adapters-goose/Cargo.toml

[dependencies]
# `test-mocks` is required at the normal dependency level because
# `goose_agent.rs::with_llamafile()` (a non-test public factory for CLI
# one-shots) constructs the in-core mock repositories.
pond-core             = { path = "../pond-core", features = ["test-mocks"] }
pond-mcp-server       = { path = "../pond-mcp-server" }
pond-adapters-weather = { path = "../pond-adapters-weather" }
# The one transport for the companion files this adapter provisions (the vision encoder and,
# when the speculation switch turns on with it absent, the drafter): resumable, pinned by size
# and sha256, and gated per redirect hop, which only holds with its redirect-aware client.
pond-hf-cache         = { path = "../pond-hf-cache" }
goose            ={ path = "../../goose/crates/goose", default-features = false, features = ["rustls-tls", "local-inference"] }
# ModelConfig and the Provider trait moved into the extracted goose-providers
# crate and are not re-exported as types from `goose`.
goose-providers  = { path = "../../goose/crates/goose-providers", default-features = false }
rmcp             = { workspace = true }
reqwest          = { workspace = true }
anyhow = "1.0"
tokio = { version = "1.49", features = ["full"] }
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = "0.7"
# The encoder's identity check: its sha256 is its Hugging Face LFS oid. The same major the
# other workspace crates hash with, so no second copy is built.
sha2 = "0.10"

[dev-dependencies]
tempfile = { workspace = true }
pond-adapters-mesh-inference = { workspace = true }

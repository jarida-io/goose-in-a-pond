[package]
name = "pond-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Expose the in-core mock adapters (normally `#[cfg(test)]`-only) to downstream
# crates. Downstream test harnesses compile pond-core WITHOUT `cfg(test)`, so
# they must enable this feature to reach the mocks.
test-mocks = []

[dependencies]
# Leaf crate — voice text/DSP primitives. See crates/pond-voice.
pond-voice = { path = "../pond-voice" }
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A data format, not a framework. Agent roles (PAI-6) are stored inside the YAML
# of an existing `agent_recipes` row, and the parse belongs in the domain: a
# malformed narrowing block has to REFUSE, and that refusal is policy.
serde_yaml = { workspace = true }
# Already in this crate's graph through tera; used for the passage ranker's answer types.
regex = { workspace = true }
tera = { workspace = true }
thiserror = "1.0"
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
# The URL parser reqwest uses, so the egress gate judges the host a request really goes to.
url = { workspace = true }

[dev-dependencies]
tempfile = "3"
# `test-util` gives tests a pausable clock, so a test that exercises a retry
# backoff asserts the behaviour without spending the backoff in real seconds.
tokio = { workspace = true, features = ["test-util"] }

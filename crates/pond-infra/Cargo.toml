[package]
name = "pond-infra"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# The phone side of CPace pairing (`pairing_cpace::Responder`), for tests that pair like a phone.
cpace-client = []

[dependencies]
pond-core = { workspace = true }
pond-net = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
hostname = { workspace = true }
tracing = { workspace = true }
reqwest = {workspace = true}
jsonwebtoken = { workspace = true }
fastembed = { workspace = true }
# Handshake / pairing (#93): HMAC pairing proof + hashed tokens.
sha2 = "0.10"
# The setup channel's HKDF-SHA-512 over CPace's ISK: 0.12 shares hmac 0.12 and sha2 0.10.
hkdf = "0.12"
hmac = { workspace = true }
rand = "0.8"
base64 = { workspace = true }
# Phone pairing (#508): CPace over ristretto255 (`pairing_cpace.rs`). 4.1 is already in the
# lock through `snow` and `ed25519-dalek`, and shares `sha2` and `digest` 0.10 with this crate.
curve25519-dalek = "4.1"
zeroize = "1"
# Phase F2: image attachments are stored as files under the OS data dir; the
# adapter resolves that dir itself (POND_DATA_DIR override first) rather than
# having it threaded down from pond-server, mirroring model_download.rs.
dirs = { workspace = true }
subtle = { workspace = true }
once_cell = { workspace = true }
# PAI-2 P4: XChaCha20-Poly1305 for $DATA_DIR/secrets.json. Its getrandom
# feature pulls rand_core 0.6, which is the same rand_core the `rand = "0.8"`
# above resolves to -- see the E0464 note in [dev-dependencies].
chacha20poly1305 = { workspace = true }
# The admin card's verifier; already in the lock through other crates, with this sha2 and hmac.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# My Pond's health page: memory, load, uptime and the process's own size.
sysinfo = { version = "0.38", default-features = false, features = ["system", "component"] }
# My Pond's disk space, as pond-server already measures it.
fs2 = { workspace = true }
# PAI-2 P3: the rule-based redactor's candidate finders. Regex stays out of
# pond-core on purpose -- the accept/reject rules live there and must not
# depend on an engine.
regex = { workspace = true }

[dev-dependencies]
# `test-mocks` only in dev-deps: the one consumer is `secret_migration`'s
# `#[cfg(test)]` module, which drives `MockSettingsRepository`. Unlike
# pond-server, nothing here reaches for a mock outside `cfg(test)`.
pond-core = { workspace = true, features = ["test-mocks"] }
tempfile = { workspace = true }
# The batch extraction engine takes a cancellation token, and the memory
# reachability harness drives it through its real `run_pass`.
tokio-util = { workspace = true }
wiremock = { workspace = true }
serde_json = { workspace = true }
rsa = { workspace = true }
# NOTE: no dev-dependency on `rand` — tests use the [dependencies] rand 0.8
# (the API `thread_rng`/`OsRng` here and rsa 0.9's rand_core 0.6 both need it);
# a second, newer rand would hand rustc two rlib candidates (E0464).

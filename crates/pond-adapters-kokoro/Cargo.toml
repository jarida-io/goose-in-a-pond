[package]
name = "pond-adapters-kokoro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Kokoro-82M (StyleTTS2) run directly through `ort`. Linkage is NOT decided here: fastembed
# (root Cargo.toml, via pond-infra) forces `ort-sys/disable-linking`, so pond-server dlopens the
# `ORT_DYLIB_PATH` set by `ensure_onnx_runtime()`. Built ALONE this crate links pyke's glibc-2.38
# prebuilt statically and fails on the Jetson (`__isoc23_strtoll`): use `--features system-ort`.

[features]
default = []
# Redundant while fastembed forces `ort/load-dynamic` workspace-wide — enabling
# this changes nothing (`cargo tree -e features -i ort` resolves the same 17
# features either way). Kept as the switch that would matter if fastembed ever
# goes optional. See the linkage note above before assuming it does anything.
system-ort = ["ort/load-dynamic"]

[dependencies]
pond-core      = { workspace = true }
pond-voice     = { path = "../pond-voice" }
pond-audio-out = { path = "../pond-audio-out" }
anyhow      = { workspace = true }
async-trait = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
serde_json  = { workspace = true }
# Default features do not decide linkage: `load-dynamic` arrives from fastembed and wins (see
# the linkage note above). `ndarray` is deliberately absent because ort resolves ndarray 0.17
# while the workspace is on 0.16; tensors are built as (shape, Vec) tuples instead.
ort = "=2.0.0-rc.12"
espeak-rs = "0.2"
# The ORT-format weights are read in place from a map, as page cache rather than anonymous memory.
memmap2 = "0.9"
# The CUDA runtime is opened at run time for Kokoro's low-priority stream; nothing links it.
libloading = { workspace = true }
# Only for the `OutputStreamHandle` type held by the adapter; playback itself
# lives in pond-audio-out.

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

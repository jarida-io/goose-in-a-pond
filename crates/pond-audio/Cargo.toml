[package]
name = "pond-audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "pond_audio"
path = "src/lib.rs"

# The single microphone owner, sitting between `pond-voice` (pure DSP, no cpal)
# and the adapters. Deps stay minimal: cpal for the device, pond-voice for the
# primitives, tracing for diagnostics. No tokio, because a cpal stream is `!Send`
# on CoreAudio, so the owner is an OS thread with a channel, not an async task.
[dependencies]
cpal = "0.15"
pond-core = { workspace = true }
pond-voice = { path = "../pond-voice" }
tracing = { workspace = true }

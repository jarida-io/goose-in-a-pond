[workspace]
resolver = "2"
members = [
    "crates/pond-core",
    "crates/pond-api",
    "crates/pond-infra",
    "crates/pond-server",
    "crates/pond-adapters-llamafile",
    "crates/pond-adapters-ollama",
    "crates/pond-adapters-whisper",
    "crates/pond-adapters-piper",
    "crates/pond-adapters-qwen-tts",
    "crates/pond-adapters-gotg",
    "crates/pond-adapters-speaker-embed",
    "crates/pond-builder",
]
# pond-adapters-goose is intentionally excluded from the default workspace build.
# It pulls in the goose/ submodule which has a diamond rmcp version conflict
# (pctx_code_execution_runtime 0.1.3 uses rmcp ^0.14 while pctx_config uses rmcp 1.2).
# This crate is also explicitly never linked into pond-server on Windows due to a
# fatal linker conflict. Build it in isolation when needed:
#   cargo build -p pond-adapters-goose
exclude = ["crates/pond-adapters-goose"]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Jerry Anyumba <jerry@jarida.io>","Liz Wangui <liz@jarida.io>",
    "Purity Wanjiru <wanjiru@jarida.io>","Emmanuel Oyugi <oyugi@jarida.io>",
    "Africia Kerubo <africia@jarida.io>"]
license = "Apache-2.0"
repository = "https://github.com/jarida-io/goose-in-a-pond"
description = "Goose in a Pond - A modular AI assistant"

[workspace.lints.clippy]
uninlined_format_args = "allow"
string_slice = "warn"

[workspace.dependencies]
goose = { path = "goose/crates/goose" }
rmcp = { version = "0.16", features = ["schemars", "auth"] }
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5.0"
dotenvy = "0.15"
env-lock = "1.0.1"
etcetera = "0.11.0"
fs2 = "0.4"
futures = "0.3"
http = "1.0"
ignore = "0.4.25"
include_dir = "0.7.4"
indoc = "2.0"
lru = "0.16"
once_cell = "1.20"
rand = "0.8"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "form", "json"] }
schemars = { default-features = false, version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shellexpand = "3.1"
tempfile = "3"
thiserror = "1.0"
tokio = { version = "1.49", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
urlencoding = "2.1"
utoipa = { version = "4.1", features = ["chrono"] }
uuid = { version = "1.11", features = ["v4"] }
webbrowser = "1.0"
which = "8.0.0"
wiremock = "0.6"
serial_test = "3.2.0"
test-case = "3.3.1"
url = "2.5.8"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["metrics"] }
opentelemetry-otlp = "0.31"
opentelemetry-appender-tracing = "0.31"
opentelemetry-stdout = { version = "0.31", features = ["trace", "metrics", "logs"] }
tracing-opentelemetry = "0.32"
hostname = "0.4"
zip = "2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate", "chrono"] }
hound   = "3.5"
ndarray = { version = "0.17", features = ["std"] }
ort     = { version = "=2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
rustfft = "6"

# Internal workspace crates
pond-core = { path = "crates/pond-core" }
pond-api = { path = "crates/pond-api" }
pond-infra = { path = "crates/pond-infra" }
pond-adapters-goose = { path = "crates/pond-adapters-goose" }
pond-adapters-llamafile = { path = "crates/pond-adapters-llamafile" }
pond-adapters-qwen-tts      = { path = "crates/pond-adapters-qwen-tts" }
pond-adapters-speaker-embed = { path = "crates/pond-adapters-speaker-embed" }

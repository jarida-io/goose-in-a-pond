[workspace]
resolver = "2"
members = [
    # Leaf crate: voice text/DSP primitives, no framework deps. Kept a leaf by
    # choice now rather than by necessity -- see its Cargo.toml.
    "crates/pond-voice",
    # Single microphone owner (cpal). Depends on pond-voice.
    "crates/pond-audio",
    # Speaker-side counterpart: playback, output device, working tone (rodio).
    "crates/pond-audio-out",
    "crates/pond-core",
    "crates/pond-api",
    "crates/pond-hf-cache",
    "crates/pond-infra",
    "crates/pond-infra-scheduler",
    "crates/pond-server",
    "crates/pond-adapters-caldav",
    "crates/pond-adapters-imap",
    "crates/pond-adapters-llamafile",
    "crates/pond-adapters-ollama",
    "crates/pond-adapters-whisper",
    # Kokoro-82M — the default TTS engine.
    "crates/pond-adapters-kokoro",
    "crates/pond-adapters-face-onnx",
    "crates/pond-adapters-matter",
    "crates/pond-adapters-vision",
    "crates/pond-adapters-vision-onnx",
    "crates/pond-adapters-silero",
    "crates/pond-adapters-weather",
    "crates/pond-adapters-mcp-memory",
    "crates/pond-mesh-protocol",
    "crates/pond-adapters-mesh-libp2p",
    "crates/pond-adapters-mesh-inference",
    "crates/pond-adapters-lightning",
    # Independent agent + inference engine (no Goose dependency — future primary path)
    "crates/pond-agent",
    "crates/pond-inference",
    # Goose-dependent crates — use goose with default-features=false to avoid
    # the rmcp version conflict (code-mode feature is not enabled).
    "crates/pond-adapters-goose",
    "crates/pond-adapters-local-inference",
    "crates/pond-mcp-server",
    # Checkpoint: a goose-free path to a mistral.rs server (pond-core only).
    "crates/pond-adapters-mistralrs",
]

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
authors = ["Jerry Anyumba <jerry@jarida.io>","Liz Wangui <liz@jarida.io>",
    "Purity Wanjiru <wanjiru@jarida.io>","Emmanuel Oyugi <oyugi@jarida.io>",
    "Africia Kerubo <africia@jarida.io>"]
license = "Apache-2.0"
repository = "https://github.com/jarida-io/goose-in-a-pond"
description = "Goose in a Pond - A modular AI assistant"

[workspace.lints.clippy]
uninlined_format_args = "allow"
string_slice = "warn"

[workspace.dependencies]
# rmcp — goose declares ^1.4; GIAP forces =1.5.0 so the submodule and
# pond-mcp-server resolve to a single rmcp. Feature list is the union.
# No GIAP workspace member uses rmcp directly.
rmcp = { version = "=1.5.0", features = ["schemars", "auth", "server", "client",
    "transport-io", "macros", "transport-child-process",
    "transport-streamable-http-client", "transport-streamable-http-client-reqwest",
    "transport-streamable-http-client-unix-socket"] }
# ── Goose sub-workspace deps ──────────────────────────────────────────────────
# Cargo resolves goose crates' `workspace = true` entries against the outermost workspace, so
# these mirror goose/Cargo.toml [workspace.dependencies]. Extra features GIAP needs are added
# (additive); where goose is a MAJOR ahead (rand, sha2, thiserror) the pond crate pins its own.
agent-client-protocol-schema = { version = "1.1", default-features = false, features = ["unstable"] }
agent-client-protocol = { version = "1.0", default-features = false }
agent-client-protocol-http = { version = "1.0", default-features = false, features = ["server", "unstable_cancel_request"] }
arboard = { version = "3", default-features = false }
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
keyring = { version = "3.6.3", default-features = false, features = ["vendored"] }
rustls = { version = "0.23.31", default-features = false, features = ["aws_lc_rs", "std"] }
sha2 = { version = "0.11", default-features = false }
hmac             = "0.12"
subtle           = "2.6"
strum = { version = "0.28.0", default-features = false, features = ["derive", "std"] }
shell-words = { version = "1", default-features = false, features = ["std"] }
rayon = { version = "1.10", default-features = false }
tracing-futures = { version = "0.2.4", default-features = false, features = ["futures-03", "std", "std-future"] }
tree-sitter = { version = "0.26", default-features = false, features = ["std"] }
tree-sitter-go = { version = "0.25", default-features = false }
tree-sitter-java = { version = "0.23", default-features = false }
tree-sitter-javascript = { version = "0.25", default-features = false }
tree-sitter-kotlin-ng = { version = "1", default-features = false }
tree-sitter-python = { version = "0.25", default-features = false }
tree-sitter-ruby = { version = "0.23", default-features = false }
tree-sitter-rust = { version = "0.24", default-features = false }
tree-sitter-swift = { version = "0.7", default-features = false }
tree-sitter-typescript = { version = "0.23", default-features = false }
# llama-cpp-2 has breaking changes in patch releases; goose pins it exactly.
llama-cpp-2 = { version = "=0.1.156", default-features = false, features = ["sampler", "mtmd", "common"] }
llama-cpp-sys-2 = { version = "=0.1.156", default-features = false }
# temporal_rs 0.1 (transitive via PCTX) enables unstable icu features without
# pinning; goose pins icu to a compatible exact version. Mirrored here.
icu_calendar = { version = "=2.1.1", default-features = false }
icu_locale = { version = "=2.1.1", default-features = false }
winapi = { version = "0.3.9", features = ["wincred", "std"] }
# zip v8 for goose; pond-server resolves the same v8 via workspace = true (it
# used to pin zip = "2" directly, which put two zip majors in the graph for
# no reason — nothing in pond-server's own zip usage needed the old major).
zip = { version = "^8.0", default-features = false, features = ["deflate"] }
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2"] }
base64 = "0.22.1"
bytes = "1"
# Secret-store encryption (PAI-2 P4). Already in Cargo.lock at 0.10.1 via nostr under the goose
# submodule, so no new download or C toolchain on a Jetson build. Default features are needed:
# `alloc` for the Vec-returning Aead methods and `getrandom` for aead::OsRng, which resolves to
# rand_core 0.6 and so matches pond-infra's pinned rand 0.8.
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# Must track the croner that `tokio-cron-scheduler` resolves: both parse the same stored
# expression, this one for the `next_run` the UI shows and the scheduler's for when the job
# fires. A MAJOR apart, an expression the two read differently displays one time and fires at
# another.
croner = "3.0"
clap = { version = "4", features = ["derive"] }
dirs = { version = "6", default-features = false }
dotenvy = "0.15"
env-lock = "1.0.1"
etcetera = "0.11.0"
fs2 = "0.4"
futures = "0.3"
http = "1.1"
ignore = "0.4.25"
include_dir = "0.7.4"
indoc = "2.0"
lru = "0.18"
once_cell = "1.21"
rand = "0.10.1"
regex = "1.12"
# Test-only: generates a throwaway RSA key so the FCM relay's signing path can
# be exercised without committing a PEM (gitleaks scans full history).
rsa = { version = "0.9", features = ["pem"] }
reqwest = { version = "0.13.2", default-features = false, features = ["multipart", "form", "json","rustls"] }
schemars = { version = "1.0.2", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tera = { version = "1", default-features = false }
shellexpand = { version = "3.1", features = ["base-0", "tilde"] }
tempfile = "3"
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.49", features = [
    "rt-multi-thread", "macros", "sync", "time",
    "io-util", "io-std", "fs", "net", "signal", "process",
] }
tokio-stream = "0.1"
tokio-tungstenite = "0.26"
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.7.0", default-features = false }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
urlencoding = "2.1"
utoipa = { version = "4.1", features = ["chrono"] }
uuid = { version = "1.23", features = ["v4"] }
webbrowser = "1.0"
which = { version = "8", features = ["real-sys"] }
wiremock = "0.6"
# Matches the version `goose/crates/goose/Cargo.toml` declares for itself; keep it in step. A
# mismatch resolves two copies side by side, each with its own `croner` MAJOR: two cron parsers
# reading the same user-authored expressions, free to disagree about "0 0 * * SUN".
tokio-cron-scheduler = "0.15"
serial_test = "3.2.0"
test-case = "3.3.1"
assert_cmd = "2"
predicates = "3"
url = "2.5.8"
opentelemetry = { version = "0.32", default-features = false }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry-http = { version = "0.32", default-features = false, features = ["internal-logs", "reqwest"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "internal-logs", "logs", "metrics", "reqwest-client", "trace"] }
opentelemetry-appender-tracing = { version = "0.32", default-features = false, features = ["experimental_span_attributes"] }
opentelemetry-stdout = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs"] }
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
hostname = "0.4"
# jsonwebtoken 10 panics at the first sign unless exactly one crypto backend feature is on.
# aws_lc_rs rather than rust_crypto is deliberate: rust_crypto pulls in the `rsa` crate, whose
# Marvin side-channel (RUSTSEC-2023-0071) has no fixed release, and .cargo/audit.toml's exception
# for it rests on rsa never being linked into pond-server. aws-lc-rs is already in the graph.
jsonwebtoken = { version = "10", default-features = false, features = [
    "use_pem",
    "aws_lc_rs",
] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate", "chrono"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ndarray = "0.16"
fastembed = { version = "=5.16.0", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }

# ── Private mesh (#132) building blocks — shared by pond-mesh-protocol and,
# later, the lightning/mesh-inference adapter crates.
blake3       = "1.8"
ed25519-dalek = "2"
prost        = "0.14"
# pond-adapters-lightning only — `Mnemonic::generate()` when no wallet seed
# exists yet. `rand`: generate() needs it for secure entropy, off by default.
bip39 = { version = "2", features = ["rand"] }
# pond-adapters-mesh-libp2p only. No `quic` feature — stays on the TCP
# transport so this doesn't pull a second quinn/rustls major version
# alongside the ones already transitive via reqwest/sqlx.
libp2p = { version = "0.56", features = [
    "tokio", "tcp", "noise", "yamux", "ed25519",
    "kad", "gossipsub", "relay", "dcutr", "identify", "ping",
    "request-response", "cbor", "macros", "websocket", "dns",
] }

# Internal workspace crates
pond-core              = { path = "crates/pond-core" }
pond-mesh-protocol      = { path = "crates/pond-mesh-protocol" }
pond-adapters-mesh-libp2p = { path = "crates/pond-adapters-mesh-libp2p" }
pond-adapters-mesh-inference = { path = "crates/pond-adapters-mesh-inference" }
pond-adapters-lightning = { path = "crates/pond-adapters-lightning" }
pond-api               = { path = "crates/pond-api" }
pond-hf-cache          = { path = "crates/pond-hf-cache" }
pond-infra             = { path = "crates/pond-infra" }
pond-infra-scheduler   = { path = "crates/pond-infra-scheduler" }
pond-adapters-llamafile = { path = "crates/pond-adapters-llamafile" }
pond-adapters-matter           = { path = "crates/pond-adapters-matter" }
pond-adapters-vision           = { path = "crates/pond-adapters-vision" }
pond-adapters-vision-onnx      = { path = "crates/pond-adapters-vision-onnx" }
pond-adapters-silero           = { path = "crates/pond-adapters-silero" }
pond-adapters-caldav           = { path = "crates/pond-adapters-caldav" }
pond-adapters-imap             = { path = "crates/pond-adapters-imap" }
pond-adapters-weather          = { path = "crates/pond-adapters-weather" }
pond-adapters-mcp-memory       = { path = "crates/pond-adapters-mcp-memory" }
pond-adapters-local-inference  = { path = "crates/pond-adapters-local-inference" }
pond-adapters-face-onnx        = { path = "crates/pond-adapters-face-onnx" }

# ── Release profile for Jetson / embedded deployment ─────────────────────────
[profile.release]
opt-level = "s"         # size-optimize (matches Tauri sub-crate choice)
lto = "thin"            # good optimization, faster compile than fat LTO
codegen-units = 1
strip = true
panic = "abort"

# Build scripts and proc macros are built for the host and then dlopen'd by
# rustc, so they must not be stripped: on macOS, stripping a proc-macro dylib
# leaves it with a "mis-aligned LINKEDIT string pool" that rustc cannot load,
# and the failure surfaces as `can't find crate for sqlx` in every crate that
# depends on it. Nothing here ships, so there is no size to reclaim anyway.
[profile.release.build-override]
strip = false

# NOTE: goose's own [patch.crates-io] (vendored v8, cudaforge) is ignored when building from this
# root; replicate entries here if its build graph ever needs them.

# GIAP fork of llama-cpp-rs. Upstream removed the OpenAI-compat chat templating in
# 0.1.147 and added MTP speculative decoding in 0.1.151, so NO published version has
# both -- and the live serving path renders every prompt through the former while the
# measured 2.8x decode win needs the latter. This is 0.1.156 with the OAI surface from
# 0.1.146 re-applied. See docs/developer/jetson-mtp-in-process-scope.md.
[patch.crates-io]
# A git rev, not a path: the Jetson has no sibling checkout, so the workspace-relative
# path this used made the fork unbuildable anywhere but my Mac. Pinned by full SHA so a
# device build and a laptop build are the same code -- move the rev deliberately, never
# by pointing at a branch.
llama-cpp-2 = { git = "https://github.com/jarida-io/llama-cpp-rs-giap", rev = "ad6e4b85573dec3603e861c4f70fb48c3f9e06fb" }
llama-cpp-sys-2 = { git = "https://github.com/jarida-io/llama-cpp-rs-giap", rev = "ad6e4b85573dec3603e861c4f70fb48c3f9e06fb" }

[workspace]
resolver = "2"
members = [
    "crates/pond-core",
    "crates/pond-api",
    "crates/pond-infra",
    "crates/pond-infra-scheduler",
    "crates/pond-server",
    "crates/pond-adapters-llamafile",
    "crates/pond-adapters-ollama",
    "crates/pond-adapters-whisper",
    "crates/pond-adapters-piper",
    "crates/pond-adapters-face-onnx",
    "crates/pond-adapters-gotg",
    "crates/pond-adapters-weather",
    "crates/pond-adapters-mcp-memory",
    # Goose-dependent crates — use goose with default-features=false to avoid
    # the rmcp version conflict (code-mode feature is not enabled).
    "crates/pond-adapters-goose",
    "crates/pond-adapters-local-inference",
    "crates/pond-mcp-server",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Jerry Anyumba <jerry@jarida.io>","Liz Wangui <liz@jarida.io>",
    "Purity Wanjiru <wanjiru@jarida.io>","Emmanuel Oyugi <oyugi@jarida.io>",
    "Africia Kerubo <africia@jarida.io>"]
license = "Apache-2.0"
repository = "https://github.com/jarida-io/goose-in-a-pond"
description = "Goose in a Pond - A modular AI assistant"

[workspace.lints.clippy]
uninlined_format_args = "allow"
string_slice = "warn"

[workspace.dependencies]
# rmcp 1.2.0 — required by goose sub-crates when cargo resolves their
# `workspace = true` deps against the outer (GIAP) workspace for path-dep builds.
# No GIAP workspace member uses rmcp directly.
rmcp = { version = "=1.2.0", features = ["schemars", "auth", "server", "client",
    "transport-io", "macros", "transport-child-process",
    "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
# ── Goose sub-workspace deps ──────────────────────────────────────────────────
# Cargo resolves goose crates' `workspace = true` dependency entries against the
# outermost workspace (GIAP) when those crates are reached via path deps.
# These entries mirror goose/Cargo.toml [workspace.dependencies] for the deps
# that are NOT already declared above in GIAP's own dep list.
agent-client-protocol-schema = { version = "0.11", features = ["unstable"] }
sacp             = "11.0.0"
arboard          = "3"
sha2             = "0.10"
strum            = { version = "0.27", features = ["derive"] }
shell-words      = "1.1"
rayon            = "1.10"
tracing-futures  = { version = "0.2", features = ["futures-03"] }
tree-sitter            = "0.26"
tree-sitter-go         = "0.25"
tree-sitter-java       = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng  = "1.1"
tree-sitter-python     = "0.25"
tree-sitter-ruby       = "0.23"
tree-sitter-rust       = "0.24"
tree-sitter-swift      = "0.7"
tree-sitter-typescript = "0.23"
winapi = { version = "0.3", features = ["wincred"] }
# zip v8 for goose; pond-server pins zip = "2" directly in its own Cargo.toml
zip = { version = "^8.0", default-features = false, features = ["deflate"] }
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5.0"
dotenvy = "0.15"
env-lock = "1.0.1"
etcetera = "0.11.0"
fs2 = "0.4"
futures = "0.3"
http = "1.0"
ignore = "0.4.25"
include_dir = "0.7.4"
indoc = "2.0"
lru = "0.16"
once_cell = "1.20"
rand = "0.8"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "form", "json","rustls"] }
schemars = { default-features = false, version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tera = { version = "1", default-features = false }
shellexpand = "3.1"
tempfile = "3"
thiserror = "1.0"
tokio = { version = "1.49", features = [
    "rt-multi-thread", "macros", "sync", "time",
    "io-util", "io-std", "fs", "net", "signal", "process",
] }
tokio-stream = "0.1"
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6.8", features = ["fs", "cors"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
urlencoding = "2.1"
utoipa = { version = "4.1", features = ["chrono"] }
uuid = { version = "1.11", features = ["v4"] }
webbrowser = "1.0"
which = "8.0.0"
wiremock = "0.6"
tokio-cron-scheduler = "0.14"
serial_test = "3.2.0"
test-case = "3.3.1"
assert_cmd = "2"
predicates = "3"
url = "2.5.8"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["metrics"] }
opentelemetry-otlp = "0.31"
opentelemetry-appender-tracing = { version = "0.31", features = ["experimental_span_attributes"] }
opentelemetry-stdout = { version = "0.31", features = ["trace", "metrics", "logs"] }
tracing-opentelemetry = "0.32"
hostname = "0.4"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate", "chrono"] }
hmac = "0.12"
subtle = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ndarray = "0.16"

# Internal workspace crates
pond-core              = { path = "crates/pond-core" }
pond-api               = { path = "crates/pond-api" }
pond-infra             = { path = "crates/pond-infra" }
pond-infra-scheduler   = { path = "crates/pond-infra-scheduler" }
pond-adapters-llamafile = { path = "crates/pond-adapters-llamafile" }
pond-adapters-weather          = { path = "crates/pond-adapters-weather" }
pond-adapters-mcp-memory       = { path = "crates/pond-adapters-mcp-memory" }
pond-adapters-local-inference  = { path = "crates/pond-adapters-local-inference" }
pond-adapters-face-onnx        = { path = "crates/pond-adapters-face-onnx" }

# ── Release profile for Jetson / embedded deployment ─────────────────────────
[profile.release]
opt-level = "s"         # size-optimize (matches Tauri sub-crate choice)
lto = "thin"            # good optimization, faster compile than fat LTO
codegen-units = 1
strip = true
panic = "abort"

# ── Patches required by goose sub-crates ─────────────────────────────────────
[patch.crates-io]
sacp       = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9" }
sacp-derive = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9" }
opentelemetry              = { git = "https://github.com/open-telemetry/opentelemetry-rust", rev = "345cd74a" }
opentelemetry_sdk          = { git = "https://github.com/open-telemetry/opentelemetry-rust", rev = "345cd74a" }
opentelemetry-appender-tracing = { git = "https://github.com/open-telemetry/opentelemetry-rust", rev = "345cd74a" }
opentelemetry-otlp         = { git = "https://github.com/open-telemetry/opentelemetry-rust", rev = "345cd74a" }
opentelemetry-stdout       = { git = "https://github.com/open-telemetry/opentelemetry-rust", rev = "345cd74a" }

# cargo-audit policy — every ignore below is a documented, justified exception, not a silenced
# finding. Re-evaluate on each weekly Security run; remove entries as soon as the owning
# dependency can be bumped. Triage rule: advisories fixable from THIS repo's lockfile are fixed,
# never ignored.

[advisories]
ignore = [
    # (RUSTSEC-2026-0187 — lopdf stack overflow — was removed here after
    # bumping lopdf to 0.42 on the goose patch branch, jarida-io/Goose PR #4.)

    # rsa: Marvin timing side-channel (5.9 medium). NO fixed release exists. Reaches us only
    # transitively and as a pond-infra DEV-dependency (throwaway RSA key for the FCM relay test).
    # Not linked into pond-server (`cargo tree -p pond-server -i rsa --edges normal` is empty);
    # GIAP crypto is HMAC-SHA256 and sha256 hashes. Remove when rsa ships a fixed version.
    "RUSTSEC-2023-0071",

    # zip 8.6.0: extract() keeps SUID/SGID bits (0367), creates symlinks pointing outside the
    # destination (0368) and applies permissions through symlinks (0369). The fix is zip 9, but
    # candle-core, docx-rs and umya-spreadsheet (latest releases, via goose) require zip ^8.6.0, so
    # this lockfile cannot drop 8.x. Nothing here calls ZipArchive::extract() or
    # ZipStreamReader::extract(): pond-server reads named entries into fixed paths, goose-cli
    # iterates through enclosed_name(). Details and review date in osv-scanner.toml. Remove when
    # those crates accept zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

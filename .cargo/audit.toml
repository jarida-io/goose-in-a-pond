# cargo-audit policy — every ignore below is a documented, justified exception, not a silenced
# finding. Re-evaluate on each weekly Security run; remove entries as soon as the owning
# dependency can be bumped. Triage rule: advisories fixable from THIS repo's lockfile are fixed,
# never ignored.

[advisories]
ignore = [
    # (RUSTSEC-2026-0187 — lopdf stack overflow — was removed here after
    # bumping lopdf to 0.42 on the goose patch branch, jarida-io/Goose PR #4.)

    # quick-xml 0.36/0.37: quadratic duplicate-attribute check (7.5) …
    "RUSTSEC-2026-0194",
    # … and unbounded namespace-declaration allocation DoS (7.5). Owned by docx-rs under
    # goose-mcp (goose submodule). BLOCKED UPSTREAM: docx-rs 0.4.20 (latest, checked 2026-07-16)
    # still requires quick-xml 0.36; the fix needs docx-rs to ship quick-xml >=0.41. GIAP does
    # not parse untrusted XML/DOCX through these paths.
    "RUSTSEC-2026-0195",

    # rsa: Marvin timing side-channel (5.9 medium). NO fixed release exists. Reaches us only
    # transitively and as a pond-infra DEV-dependency (throwaway RSA key for the FCM relay test).
    # Not linked into pond-server (`cargo tree -p pond-server -i rsa --edges normal` is empty);
    # GIAP crypto is HMAC-SHA256 and sha256 hashes. Remove when rsa ships a fixed version.
    "RUSTSEC-2023-0071",

    # hickory-proto 0.25.2: NSEC3 closest-encloser proof enters an unbounded
    # loop on cross-zone responses (RUSTSEC-2026-0118 — NO fixed release
    # exists), and O(n^2) name compression during message encoding
    # (RUSTSEC-2026-0119 — needs >=0.26.1).
    #
    # BLOCKED UPSTREAM: reaches us only as
    #   hickory-proto <- hickory-resolver 0.25 <- libp2p-dns <- libp2p 0.56
    #   <- pond-adapters-mesh-libp2p <- pond-server
    # and libp2p 0.56 pins hickory-resolver 0.25, so 0.26.1 needs a libp2p
    # bump, not a lockfile change.
    #
    # NOT IN THE DEFAULT BINARY: libp2p is behind the optional `mesh` feature.
    # `cargo tree -p pond-server -i hickory-proto --edges normal` reports the
    # package is not in the graph at all; it appears only with
    # `--features mesh`. Even then it is DNS resolution for dialling mesh
    # peers, gated again at runtime by `settings.mesh_enabled`, and GIAP does
    # not perform DNSSEC validation — the NSEC3 path 0118 needs.
    #
    # Re-evaluate when libp2p ships a release on hickory 0.26.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
]

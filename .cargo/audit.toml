# cargo-audit policy — every ignore below is a documented, justified exception, not a silenced
# finding. Re-evaluate on each weekly Security run; remove entries as soon as the owning
# dependency can be bumped. Triage rule: advisories fixable from THIS repo's lockfile are fixed,
# never ignored.

[advisories]
ignore = [
    # (RUSTSEC-2026-0187 — lopdf stack overflow — was removed here after
    # bumping lopdf to 0.42 on the goose patch branch, jarida-io/Goose PR #4.)

    # rsa: Marvin timing side-channel (5.9 medium). NO fixed release exists. Reaches us only
    # transitively and as a pond-infra DEV-dependency (throwaway RSA key for the FCM relay test).
    # Not linked into pond-server (`cargo tree -p pond-server -i rsa --edges normal` is empty);
    # GIAP crypto is HMAC-SHA256 and sha256 hashes. Remove when rsa ships a fixed version.
    "RUSTSEC-2023-0071",

    # crypto-bigint 0.5.5: timing variability in operations meant to be constant-time. Fixed
    # only in 0.7.6, a new major. Reached only through pond-adapters-lightning (pond-server's
    # optional `lightning` feature, off by default) via breez-sdk-spark's k256/elliptic-curve
    # 0.13; breez-sdk-spark 0.27.2, its latest release, still locks 0.5.5. Remove when it moves
    # to elliptic-curve 0.14. Review by 2027-01-31 (same date as osv-scanner.toml).
    "RUSTSEC-2026-0387",

    # zip 8.6.0: eight defects, all patched only in zip 9 (a new major)
    #   RUSTSEC-2026-0367  SUID/SGID bits preserved by extract()
    #   RUSTSEC-2026-0368  extract() creates symlinks whose targets leave the destination
    #   RUSTSEC-2026-0369  extract()/ZipStreamReader::extract() chmod through symlinks
    #   RUSTSEC-2026-0429  extract() aborts the process on a symlink entry with a large size
    #   RUSTSEC-2026-0545  AES entries returned unauthenticated when the stream ends early
    #   RUSTSEC-2026-0546  extract() writes outside the destination through absolute symlinks
    #   RUSTSEC-2026-0547  legacy Shrink/Reduce/Implode decoders preallocate the declared size
    #   RUSTSEC-2026-0548  ZipStreamReader trusts local-header names (fixed in 9.0.5)
    # Not fixable from this lockfile: docx-rs 0.4.22 (its latest release) and umya-spreadsheet
    # 3.1.1 (its latest stable), both under goose-mcp, require zip ^8.6.0, and zip 8 has no
    # patched release. candle-core 0.11.1 and pond-server could move to zip 9, but 8.6.0 would
    # stay in the graph for those two. Not reachable: nothing in the build calls extract() or
    # uses ZipStreamReader, and only zip's deflate features are compiled (no aes-crypto, no
    # legacy-zip). pond-server's buffalo_l download reads entries with by_index() and writes each
    # to a fixed path chosen by file name (model_download.rs); candle-core, docx-rs and
    # umya-spreadsheet only read archives in memory. Remove when docx-rs and umya-spreadsheet
    # ship on zip 9. Review by 2027-01-31 (same date as osv-scanner.toml).
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0546",
    "RUSTSEC-2026-0547",
    "RUSTSEC-2026-0548",

    # libsqlite3-sys 0.30.1: its bundled SQLite can return uninitialised page-cache memory when a
    # database is opened beside a crafted -wal file. Fixed in 0.39.0, but sqlx-sqlite (sqlx 0.8.6
    # and 0.9.0, its latest release) requires <0.38, and links = "sqlite3" allows one copy. Not
    # reachable: the server opens only databases it created in its own data directory (pond-infra
    # db.rs and sqlite_vector_index.rs, goose session_manager.rs). Remove when sqlx takes 0.39.
    # Review by 2027-01-31 (same date as osv-scanner.toml).
    "RUSTSEC-2026-0459",
]

# cargo-audit policy — every ignore below is a documented, justified exception, not a silenced
# finding. Re-evaluate on each weekly Security run; remove entries as soon as the owning
# dependency can be bumped. Triage rule: advisories fixable from THIS repo's lockfile are fixed,
# never ignored.

[advisories]
ignore = [
    # (RUSTSEC-2026-0187 — lopdf stack overflow — was removed here after
    # bumping lopdf to 0.42 on the goose patch branch, jarida-io/Goose PR #4.)

    # rsa: Marvin timing side-channel (5.9 medium). NO fixed release exists. Reaches us only
    # transitively and as a pond-infra DEV-dependency (throwaway RSA key for the FCM relay test).
    # Not linked into pond-server (`cargo tree -p pond-server -i rsa --edges normal` is empty);
    # GIAP crypto is HMAC-SHA256 and sha256 hashes. Remove when rsa ships a fixed version.
    "RUSTSEC-2023-0071",

    # crypto-bigint 0.5.5: timing variability in operations meant to be constant-time. Fixed
    # only in 0.7.6, a new major. Reached only through pond-adapters-lightning (pond-server's
    # optional `lightning` feature, off by default) via breez-sdk-spark's k256/elliptic-curve
    # 0.13; breez-sdk-spark 0.27.2, its latest release, still locks 0.5.5. Remove when it moves
    # to elliptic-curve 0.14. Review by 2027-01-31 (same date as osv-scanner.toml).
    "RUSTSEC-2026-0387",

    # zip 8.6.0: four extraction-to-disk defects, all patched only in zip 9.0.0 (a new major)
    #   RUSTSEC-2026-0367  SUID/SGID bits preserved by extract()
    #   RUSTSEC-2026-0368  extract() creates symlinks whose targets leave the destination
    #   RUSTSEC-2026-0369  extract()/ZipStreamReader::extract() chmod through symlinks
    #   RUSTSEC-2026-0429  extract() aborts the process on a symlink entry with a large size
    # Not fixable from this lockfile: candle-core 0.11.0, docx-rs 0.4.22 and umya-spreadsheet
    # 3.1.1 (each the latest release, all reached through goose) require zip ^8.6.0, and zip 8
    # has no patched release. Moving pond-server alone to zip 9 would add a second major and
    # leave 8.6.0 in the graph. Not reachable: all four advisories live in extract(), and
    # nothing in the build calls it. pond-server's buffalo_l download reads entries with
    # by_index() and writes each to a fixed path chosen by file name (model_download.rs);
    # candle-core, docx-rs and umya-spreadsheet only read archives in memory. Remove when those
    # three crates ship on zip 9. Review by 2027-01-31 (same date as osv-scanner.toml).
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",

    # libsqlite3-sys 0.30.1 bundles SQLite 3.46, which can return stale page-cache memory when a
    # database is opened with a crafted sibling -wal file of another page size (CVE-2026-119375).
    # Fixed in 0.39.0 (SQLite 3.54), but no sqlx release can take it: sqlx-sqlite 0.8.6 requires
    # ~0.30 and 0.9.0 requires <0.38, and `links = "sqlite3"` allows one copy in the graph, so
    # rusqlite (breez-sdk-spark, optional lightning feature) cannot move alone. Not reachable as
    # an attack: the pond opens only its own databases, in its data directory (owner-only, on
    # the encrypted volume when there is one; pond-infra db.rs and sqlite_vector_index.rs) and
    # Goose's sessions.db under it, never a file someone else supplies. Remove when sqlx allows
    # libsqlite3-sys >= 0.39. Review by 2027-01-31 (same date as osv-scanner.toml).
    "RUSTSEC-2026-0459",

    # rmcp 2.1.0, two client-side defects:
    #   RUSTSEC-2026-0457  OAuth discovery SSRF: the filter checked host strings, not resolved
    #                      addresses (fixed in 3.7.0)
    #   RUSTSEC-2026-0462  Streamable HTTP clients buffer a response body with no limit, so a
    #                      server that never ends its reply exhausts memory (fixed in 3.9.0)
    # Not fixable from this lockfile: the goose fork (jarida-io/Goose main) pins rmcp =2.1.0,
    # and the workspace pin must match it (CLAUDE.md, "The rmcp pin"); upstream goose moved to
    # rmcp 3 after the fork's last sync. Reachable, so this is a short exception, not a
    # verdict: an owner can add a remote (streamable_http) MCP extension, and a malicious or
    # compromised one could exhaust the pond's memory or make it request an address inside
    # the home network during OAuth discovery. The builtin giap-* extensions and stdio ones
    # never use these clients. Until the port lands, connect only to MCP servers you trust.
    # Remove when the fork and this workspace are on rmcp >= 3.9.0. Review by 2026-12-15.
    "RUSTSEC-2026-0457",
    "RUSTSEC-2026-0462",
]

# Packaging for the desktop app.
#
# Reproduces what tauri.conf.json produced, including its signing posture --
# which is none. See the `mac.identity` note below, because that one is a
# deliberate setting and not an omission.

appId: app.goose-in-a-pond.desktop
productName: Goose In A Pond
copyright: Copyright (c) 2026 Jarida Open Source Community

directories:
  output: release
  buildResources: build

files:
  - "dist/**"
  - "dist-electron/**"
  # The tray icons are loaded at RUNTIME, so they have to be inside the asar.
  # They deliberately do NOT live in build/, which electron-builder reads at
  # packaging time and never copies into the app -- a tray icon there works in
  # dev and silently disappears once packaged.
  - "electron/assets/**"
  - "package.json"
  # Ship no node_modules at all. Everything the renderer uses is already
  # bundled into dist/ by Vite, and tsup bundles the main process and preload
  # with `electron` as the only external -- which the runtime provides. Without
  # this, electron-builder includes every production dependency anyway and the
  # asar goes from ~5 MB to ~105 MB of code that is already in dist/.
  - "!node_modules/**"

extraResources:
  # Staged by scripts/stage-server-sidecar.sh and checked by
  # scripts/verify-sidecar.sh. It lands at Contents/Resources/pond-server,
  # which is where the main process looks via process.resourcesPath.
  - from: "resources/pond-server"
    to: "pond-server"
  - from: "resources/pondnet"
    to: "pondnet"
  # The LiteRT-LM C API library and the LiteRT runtime it loads, staged by
  # scripts/stage-server-sidecar.sh from the package `giap.sh litert build`
  # records. goose's litert backend looks in a litert-lm/ directory beside the
  # pond-server executable, so it lands at Contents/Resources/litert-lm/. When
  # nothing is staged, electron-builder skips this entry with a warning and the
  # app ships without the litert backend.
  - from: "resources/litert-lm"
    to: "litert-lm"
  # The Matter controller's sources. pond-server copies these to a writable
  # directory and runs `npm ci` there on first use; it finds them by walking up
  # from its own path, and Contents/Resources/matter-server is the first
  # candidate it tries.
  - from: "../matter-server/package.json"
    to: "matter-server/package.json"
  - from: "../matter-server/package-lock.json"
    to: "matter-server/package-lock.json"
  - from: "../matter-server/tsconfig.json"
    to: "matter-server/tsconfig.json"
  - from: "../matter-server/vendor"
    to: "matter-server/vendor"
  - from: "../matter-server/src"
    to: "matter-server/src"

mac:
  category: public.app-category.productivity
  minimumSystemVersion: "10.15"
  # A real multi-resolution .icns rather than a single PNG for the packager to
  # downscale. Generated by scripts/make-icons.py from the brand mark.
  icon: build/icon.icns
  target:
    - target: dir
    - target: dmg

  # Nothing in this repo is signed or notarized, and these two lines are how
  # that stays true on purpose. electron-builder defaults hardenedRuntime to
  # true and will happily discover a Developer ID in the local keychain, so
  # leaving them unset means a build on a machine that has one behaves
  # differently from a build on a machine that does not -- and hardened runtime
  # without an audio-input entitlement is exactly how you get a microphone that
  # worked yesterday and does not today.
  #
  # When signing does arrive: a Developer ID Application certificate,
  # hardenedRuntime true, an entitlements plist carrying
  # com.apple.security.device.audio-input, .camera, .bluetooth,
  # automation.apple-events (the music extension scripts Music.app),
  # cs.allow-jit and cs.allow-unsigned-executable-memory (V8), and
  # cs.disable-library-validation (the Rust sidecar and node are not signed by
  # this team). Then re-run the microphone and Bluetooth checks from scratch,
  # because hardened runtime is the most likely thing to break TCC inheritance
  # and it breaks it silently.
  identity: null
  hardenedRuntime: false

  # The sidecar is a nested Mach-O binary; naming it here is what gets it
  # signed too, once signing is on. So is every LiteRT-LM dylib, which
  # scripts/verify-sidecar.sh checks against what is staged. They carry ad-hoc
  # signatures until then, and signing rewrites them, so the MANIFEST.sha256
  # staged beside them has to be written again after signing.
  binaries:
    - "Contents/Resources/pond-server"
    - "Contents/Resources/pondnet"
    - "Contents/Resources/litert-lm/liblitert-lm.dylib"
    - "Contents/Resources/litert-lm/libLiteRt.dylib"
    - "Contents/Resources/litert-lm/libGemmaModelConstraintProvider.dylib"
    # Metal only: LiteRT loads WebGPU before Metal on a Mac, so the app carries
    # no WebGPU accelerator (LITERT_DESKTOP_LEAVES_OUT, scripts/lib/litert-setup.sh).
    - "Contents/Resources/litert-lm/libLiteRtMetalAccelerator.dylib"
    - "Contents/Resources/litert-lm/libLiteRtTopKMetalSampler.dylib"

  extendInfo:
    NSMicrophoneUsageDescription: >-
      Goose In A Pond uses the microphone for voice commands and wake word
      detection.
    NSCameraUsageDescription: >-
      Goose In A Pond uses the camera for face-based user recognition during
      enrollment and wake-on-face identification.
    NSAppleEventsUsageDescription: >-
      Goose In A Pond controls the Music app to play, pause and skip songs when
      you ask it to.
    # Required, not optional, and the consequence of omitting it is not a
    # refused radio: macOS SIGKILLs a process that touches CoreBluetooth
    # without this key. Verified -- the crash report reads, verbatim, "This app
    # has crashed because it attempted to access privacy-sensitive data without
    # a usage description. The app's Info.plist must contain an
    # NSBluetoothAlwaysUsageDescription key". The Matter controller is a bare
    # `node` with no bundle of its own, so macOS attributes the permission to
    # the responsible process at the root of its tree -- this app, when it is
    # the app that launched pond-server. Note that chain is one hop longer
    # under Electron than it was under Tauri, so re-verify it on a real BLE
    # pairing rather than assuming it carried over.
    NSBluetoothAlwaysUsageDescription: >-
      Goose In A Pond uses Bluetooth so a phone nearby can find and set up this
      pond, and to set up new smart-home devices, which announce themselves over
      Bluetooth before they are on your network.
    # The pond registers _pond._tcp with mDNSResponder; without these, recent
    # macOS can refuse a bundled app's Bonjour registration as local-network use.
    NSLocalNetworkUsageDescription: >-
      Goose In A Pond announces itself on your home network so your phone can
      find it and connect.
    NSBonjourServices:
      - _pond._tcp
    # Keep the app on screen and in the Dock -- explicitly not an agent. This
    # must stay false even if the window hides to the tray, or the app never
    # appears in the Dock at all.
    LSUIElement: false
    LSBackgroundOnly: false
    NSSupportsAutomaticGraphicsSwitching: true

dmg:
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

name: CI

# `paths-ignore` belongs to each EVENT, not to `on:` itself — at the top level
# GitHub reads it as the name of an event that does not exist and the filter
# silently does nothing.
on:
  push:
    # Trunk only. A PR branch used to match here AND on `pull_request`, so every
    # push to an open PR ran the entire matrix twice for one change. The PR event
    # is the gate that actually blocks a merge, so it is the one worth paying for.
    branches: [main, hardening]
    paths-ignore: &docs-only
      - "**/*.md"
      - "docs/**"
      - ".ai/**"
      - "LICENSE"
  pull_request:
    branches: [main, hardening]
    # Documentation cannot break a build, and this repo's guides are long and
    # edited often — each edit was spending a full Rust + frontend matrix to
    # prove that markdown still parses.
    paths-ignore: *docs-only

# One run per branch. Without this every push started a fresh full matrix and
# left the previous one running to completion against a commit nobody would
# merge; a burst of three pushes billed three complete builds to answer a
# question only the last one asked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml sets `-C target-cpu=native` for Jetson perf. On CI that is a SIGILL
  # landmine: target/ is cached across heterogeneous runners, so proc-macros built with one CPU's
  # features crash on another. An explicitly set (empty) RUSTFLAGS overrides config-file
  # rustflags, keys rust-cache separately and changes fingerprints, so poisoned caches rebuild.
  RUSTFLAGS: ""

jobs:
  # 1: Rust ─────────────────────────────────────────────────────────────
  # Formatting, lints and the fast test suite. Excludes crates that pull the Goose submodule or
  # native system libs (pond-adapters-goose, pond-adapters-local-inference,
  # pond-adapters-face-onnx, pond-server) to keep compile time reasonable.
  rust:
    name: Rust — fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      # Reclaim ~25GB on the hosted runner before the heavy goose build, so the
      # production-binary `cargo check` + the rust-cache save step don't ENOSPC.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          df -h /

      # Clone goose at the fork's main HEAD, bypassing submodule SHA pinning. jarida-io/Goose:main
      # is upstream main + the GIAP patch set (docs/goose-patch-management.md). A BREAKING future
      # sync must be staged on a side branch and fast-forwarded into fork main together with the
      # parent-side port, or older parent branches fail CI on fresh runs.
      #
      # THAT HAPPENED, AND WAS RESOLVED 2026-09-12 by the missing fast-forward. It is recorded
      # here because the failure mode is silent and will recur the same way. What it looked like:
      # the parent pinned a side-branch SHA asking for llama-cpp-2 =0.1.156 and patching it to
      # jarida-io/llama-cpp-rs-giap rev ad6e4b85 (which declares 0.1.156), while fork main's goose
      # still asked for =0.1.146 -- a version that patch CANNOT satisfy. So a run against fork main
      # resolved a different graph than anything that ships, and `cargo check` never links, so it
      # passed anyway. Fork main also had plain `cuda` where the side branch had `cuda-no-vmm`, the
      # flag that fixed a shipped Jetson OOM.
      #
      # Now: fork `main` and `feat/llama-cpp-2-0.1.156-oai-fork` are the same commit, main asks for
      # =0.1.156, and `cuda-no-vmm` is on main. `--locked` on every cargo step below is the standing
      # guard -- a resolve that disagrees with Cargo.lock fails loudly instead of quietly checking
      # something nobody runs. To check by hand, compare the two refs and the version they ask for:
      #
      #   git ls-remote https://github.com/jarida-io/Goose main refs/heads/feat/llama-cpp-2-0.1.156-oai-fork
      - name: Checkout goose submodule
        run: |
          rm -rf goose
          git clone --depth=1 --branch main https://github.com/jarida-io/Goose goose

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo/registry and the build target dir keyed on Cargo.lock.
      # After the first run, unchanged crates are not recompiled.
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        # `update` first: the runner image ships a cached apt index, and when a
        # mirror supersedes a package version the stale index 404s the install
        # (this flaked both PR #188 and #189 on 2026-07-16).
        #
        # protobuf-compiler is for the lightning steps below: breez-sdk-spark
        # pulls spark-token-primitives, whose build script compiles its own
        # .proto files and fails with "Could not find `protoc`" without it. The
        # runner image does not ship one, and a developer machine usually does,
        # which is why this only ever broke in CI.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev protobuf-compiler

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: rustup component add clippy

      - name: cargo clippy (fast crates)
        run: |
          cargo clippy --locked \
            -p pond-voice \
            -p pond-audio \
            -p pond-core \
            -p pond-infra \
            -p pond-infra-scheduler \
            -p pond-api \
            -p pond-adapters-llamafile \
            -p pond-adapters-ollama \
            -p pond-adapters-whisper \
            -p pond-adapters-matter \
            -p pond-adapters-vision \
            -p pond-adapters-weather \
            -p pond-adapters-caldav \
            -p pond-adapters-imap \
            -p pond-adapters-mcp-memory \
            -p pond-mesh-protocol \
            -p pond-mcp-server \
            -p pond-adapters-mistralrs \
            -p pond-hf-cache

      # --ignored is NOT passed so the 28 live-hardware tests are skipped.
      - name: cargo test (fast crates)
        run: |
          cargo test --locked \
            -p pond-voice \
            -p pond-audio \
            -p pond-core \
            -p pond-infra \
            -p pond-infra-scheduler \
            -p pond-api \
            -p pond-adapters-llamafile \
            -p pond-adapters-ollama \
            -p pond-adapters-whisper \
            -p pond-adapters-matter \
            -p pond-adapters-vision \
            -p pond-adapters-weather \
            -p pond-adapters-caldav \
            -p pond-adapters-imap \
            -p pond-adapters-mcp-memory \
            -p pond-mesh-protocol \
            -p pond-mcp-server \
            -p pond-hf-cache

      # Gate the PRODUCTION binary's compilation (pulls the Goose submodule); slow on a cold cache.
      # `--all-targets` is load-bearing: without a target selector cargo builds lib + bins ONLY, so
      # these crates' tests/ and examples/ (excluded from the fast test job) would be compiled by
      # nothing. Not `--tests`: that builds bins in cfg(test) mode and misses `#[cfg(not(test))]`.
      - name: cargo check (production binary + its test targets — pond-server + goose adapter)
        run: cargo check --locked -p pond-server -p pond-adapters-goose --all-targets

      # The check above doesn't pass --features mesh, but the staged sidecar
      # build always does — this catches a mesh-only break the other misses.
      - name: cargo check (production binary with mesh feature — matches the staged sidecar build)
        run: cargo check --locked -p pond-server --features mesh --all-targets

      # The quarantined PondAgent stack (Q2-05). Off pond-server's default features, so the gate
      # above never reaches it, yet AGENTS.md promises it "compiles and can be enabled"; hence
      # `--all-targets` here too. It is off the fast pass because it builds llama-cpp-2.
      - name: cargo check (quarantined PondAgent + its test targets — pond-agent + pond-inference)
        run: cargo check --locked -p pond-agent -p pond-inference --all-targets

      # The direct mistral.rs backend is off by default, so nothing above
      # compiles the ~60 lines in main.rs that wire it. An off-by-default
      # feature nobody checks is how `pond-agent` rotted; this is the same
      # guard, and it only re-checks pond-server itself — the dependency graph
      # is unchanged, so the goose submodule is already built by the step above.
      - name: cargo check (direct mistral.rs backend — off by default, so nothing else builds it)
        run: cargo check --locked -p pond-server --features mistralrs-agent

      # `cargo check --all-targets` above COMPILES pond-inference's tests but never RUNS them.
      # `no_giap_code_calls_llama_backend_init` and
      # `the_backend_handle_is_held_strongly_and_never_freed` guard against a process-wide panic
      # when GIAP and Goose both claim the llama backend; the live embed test is `#[ignore]`d.
      - name: cargo test (in-process GGUF engine + embedder — pond-inference)
        run: cargo test --locked -p pond-inference

      # Compile-gate the ONNX vision classifier (ort is too heavy for the fast
      # lint/test pass, mirroring pond-adapters-face-onnx). Its pure decode/
      # preprocess tests run here too — they need no ONNX Runtime library.
      - name: cargo test (vision classifier — pond-adapters-vision-onnx)
        run: cargo test -p pond-adapters-vision-onnx

      # Isolated like vision-onnx above: full-feature libp2p (kad+gossipsub+relay+dcutr+identify+
      # noise+yamux) is a materially heavier compile than the fast-crates list, and the crate does
      # not touch Goose so it does not belong in the production binary check either.
      - name: cargo clippy (mesh transport — pond-adapters-mesh-libp2p)
        run: cargo clippy -p pond-adapters-mesh-libp2p --all-targets

      - name: cargo test (mesh transport — pond-adapters-mesh-libp2p)
        run: cargo test -p pond-adapters-mesh-libp2p

      # Isolated like mesh-libp2p above — dev-dependencies pull in the full
      # libp2p stack. Previously only type-checked as a side effect of the
      # goose-adapter check, never linted or tested.
      - name: cargo clippy (mesh inference — pond-adapters-mesh-inference)
        run: cargo clippy -p pond-adapters-mesh-inference --all-targets

      - name: cargo test (mesh inference — pond-adapters-mesh-inference)
        run: cargo test -p pond-adapters-mesh-inference

      # Previously compiled by nothing in CI at all. Its one live-network
      # test needs a real BREEZ_API_KEY and stays #[ignore]d, like the other
      # live-hardware tests in the fast job.
      - name: cargo clippy (lightning payment rail — pond-adapters-lightning)
        run: cargo clippy -p pond-adapters-lightning --all-targets

      - name: cargo test (lightning payment rail — pond-adapters-lightning)
        run: cargo test -p pond-adapters-lightning

  # 2: Frontend ─────────────────────────────────────────────────────────
  # Runs Vitest unit tests and Playwright E2E tests.
  # Playwright spins up the Vite dev server itself (no pond-server process needed —
  # all API calls are intercepted by page.route() mocks in the test files).
  matter-server:
    name: Matter controller — tsc / vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matter-server
    steps:
      - uses: actions/checkout@v7

      # 20.19 is matter.js's floor and the one server_setup.rs enforces at
      # runtime, so CI builds against the oldest Node a Pond may have rather
      # than the newest the runner offers.
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: matter-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The controller runs under tsx with no build step, so nothing else would
      # ever type-check it.
      - name: Typecheck
        run: npx tsc --noEmit

      # The cluster mappings are pure functions over recorded devices: no
      # fabric, no hardware, no network.
      - name: Vitest (unit tests)
        run: npx vitest run

  frontend:
    name: Frontend — vitest / playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pond-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pond-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # Nothing in this job launches Electron, and setup-node's npm cache
          # does not cover ~/.cache/electron — so skip the ~100 MB download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # Vite builds with esbuild, which strips types without checking them, so
      # until this step existed nothing type-checked pond-desktop/dist — the
      # very artifact pond-api embeds with include_dir!.
      - name: Typecheck
        run: npm run typecheck

      - name: Vitest (unit tests)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright (E2E tests)
        run: npx playwright test

  # A headless launch of the real Electron main process. This is the successor
  # to `cargo test --manifest-path pond-desktop/src-tauri/...`, which nothing
  # ever ran -- except that this one exercises the parts that command could
  # not: the window actually opening, the app:// protocol handler serving the
  # bundle, and the preload publishing exactly the contract's surface.
  #
  # Honest about its limits. On ubuntu under xvfb this does NOT prove: the
  # macOS menu (so not the clipboard), any TCC prompt, a real microphone, a
  # real sidecar, the .dmg, or that the tray icon is visible rather than
  # merely constructed. Those are in the manual runbook and stay there.
  desktop-smoke:
    name: Desktop — headless launch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pond-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22, not 20, because that is Electron's own floor: electron@44
          # declares `engines: { node: ">= 22.12.0" }`, so running these jobs
          # on 20 was below the package's stated minimum. It also gives the
          # smoke script a global WebSocket, which Node gained in 22 and which
          # it needs to speak the devtools protocol.
          node-version: 22
          cache: npm
          cache-dependency-path: pond-desktop/package-lock.json

      # setup-node's npm cache does not cover Electron's own binary, which
      # lands in ~/.cache/electron. Without this the ~100 MB download happens
      # on every run; keyed on the lockfile so it only misses on a real bump.
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pond-desktop/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build the renderer and the main process
        run: npm run build && npm run build:main

      # Two separate things have to be true before Electron will start here.
      #
      # 1. The binary must actually be extracted. `npm ci` does not reliably
      #    leave node_modules/electron/dist populated on this runner -- the
      #    first run fetched it lazily, during the smoke step. So force it now,
      #    while there is still something that can report a clear failure.
      #
      # 2. The SUID sandbox helper must be root-owned and mode 4755, which npm
      #    cannot do. Chromium refuses to start rather than quietly drop the
      #    sandbox: "The SUID sandbox helper binary was found, but is not
      #    configured correctly. Rather than run without sandboxing I'm
      #    aborting now."
      #
      # Fixing the ownership rather than passing --no-sandbox, deliberately:
      # --no-sandbox would make this job green while exercising a
      # configuration nobody ships, and would stop the smoke test ever
      # noticing if the sandbox broke for real.
      - name: Prepare Electron and its sandbox helper
        run: |
          set -euo pipefail
          # Electron 44's npm package has NO postinstall script -- check its
          # package.json, there is no `scripts` field at all. Extraction is
          # explicit, through the `install-electron` bin it declares. So
          # `npm ci` legitimately leaves node_modules/electron/dist empty, and
          # `npm rebuild electron` does nothing because there is nothing to
          # rebuild. Verified both locally.
          #
          # Extract it here, without running it. The ordering is circular if
          # you get it wrong: the binary will not start until the sandbox
          # helper is root-owned, and the helper does not exist until the
          # binary is extracted. `npx electron --version` is not a way out --
          # it goes far enough into Chromium startup to hit the very same
          # FATAL:setuid_sandbox_host.cc abort.
          npx install-electron
          SANDBOX=node_modules/electron/dist/chrome-sandbox
          if [ ! -f "$SANDBOX" ]; then
            echo "::error::expected $SANDBOX to exist after preparing Electron"
            ls -la node_modules/electron/dist 2>/dev/null | head -20 || echo "(no dist directory at all)"
            exit 1
          fi
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          ls -l "$SANDBOX"

      - name: Launch headless and assert the bridge
        run: xvfb-run -a node scripts/smoke.mjs

  # Packages a real .app and checks its shape. Gated to manual dispatch and
  # tags ONLY: macOS runners bill at 10x, and nothing here changes often
  # enough to justify that per PR. It also fabricates a tiny Mach-O in place
  # of pond-server rather than building the real one -- a clean release build
  # of the server is ~35 minutes, and this job is testing the packaging, not
  # the server.
  desktop-package:
    name: Desktop — package (macOS)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    defaults:
      run:
        working-directory: pond-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Electron's declared floor — see the note in desktop-smoke.
          node-version: 22
          cache: npm
          cache-dependency-path: pond-desktop/package-lock.json

      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pond-desktop/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build the renderer and the main process
        run: npm run build && npm run build:main

      - name: Stand in a Mach-O for the sidecar
        run: |
          mkdir -p resources
          printf '#include <stdio.h>\nint main(void){puts("stub");return 0;}\n' > /tmp/stub.c
          cc -o resources/pond-server /tmp/stub.c
          bash ../scripts/lib/dist-stamp.sh dist > resources/.dist-stamp
          bash ../scripts/verify-sidecar.sh

      - name: Package
        run: npx electron-builder --mac dir

      # These four assertions are the whole point of the job. The plist one in
      # particular guards a key whose absence is a SIGKILL rather than a
      # refused permission -- see the comment in electron-builder.yml.
      - name: Assert the bundle's shape
        run: |
          APP="release/mac-arm64/Goose In A Pond.app"
          test -x "$APP/Contents/Resources/pond-server"
          test -f "$APP/Contents/Resources/matter-server/package.json"
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Contents/Info.plist"
          plutil -extract NSBluetoothAlwaysUsageDescription raw "$APP/Contents/Info.plist"

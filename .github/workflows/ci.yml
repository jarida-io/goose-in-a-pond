name: CI

# `paths-ignore` belongs to each EVENT, not to `on:` itself — at the top level
# GitHub reads it as the name of an event that does not exist and the filter
# silently does nothing.
on:
  push:
    # Trunk only. A PR branch used to match here AND on `pull_request`, so every
    # push to an open PR ran the entire matrix twice for one change. The PR event
    # is the gate that actually blocks a merge, so it is the one worth paying for.
    branches: [main, hardening]
    paths-ignore: &docs-only
      - "**/*.md"
      - "docs/**"
      - ".ai/**"
      - "LICENSE"
  pull_request:
    # Stacked feature/security PRs need the same checks before their bases merge.
    # Documentation cannot break a build, and this repo's guides are long and
    # edited often — each edit was spending a full Rust + frontend matrix to
    # prove that markdown still parses.
    paths-ignore: *docs-only

# A PR cancels a superseded run: nobody will merge the tree it tested. Main does not, because
# merges land faster than a full run finishes and cancelling there would leave no main commit
# verified. A newer push to main replaces the pending run, never the running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job only reads the repository; caches and artifacts use the runtime token, not this one.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml sets `-C target-cpu=native` for Jetson perf. On CI that is a SIGILL
  # landmine: target/ is cached across heterogeneous runners, so proc-macros built with one CPU's
  # features crash on another. An explicitly set (empty) RUSTFLAGS overrides config-file
  # rustflags, keys rust-cache separately and changes fingerprints, so poisoned caches rebuild.
  RUSTFLAGS: ""

jobs:
  embedded-network:
    name: Embedded Go — race / vet / ARM64 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/pondnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: native/pondnet/go.mod
          cache-dependency-path: native/pondnet/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Race tests
        run: go test -mod=readonly -race ./...
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Vulnerability reachability
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Production commands
        run: go build -mod=readonly ./cmd/...
      - name: Jetson helper cross-compilation
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/pondnet-linux-arm64" ./cmd/pondnet

  # scripts/lib/litert-setup.sh packages and verifies the LiteRT-LM library that goose's litert
  # backend loads into the server process, so it is tested like code: against stand-in files and
  # fake tools, and here also against real ELF libraries that a real patchelf rewrites. No Bazel,
  # no Docker and no network. LITERT_TEST_REQUIRE_NATIVE makes the ELF test fail rather than skip
  # when a tool it needs is missing here.
  litert-setup:
    name: LiteRT-LM packaging - bash tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: patchelf
        run: command -v patchelf || { sudo apt-get update -qq && sudo apt-get install -y -qq patchelf; }

      - name: Tests
        env:
          LITERT_TEST_REQUIRE_NATIVE: "1"
        run: bash scripts/lib/litert-setup.test.sh

  # 1: Rust ─────────────────────────────────────────────────────────────
  # Formatting, lints and the fast test suite. Excludes crates that pull the Goose submodule or
  # native system libs (pond-adapters-goose, pond-adapters-local-inference,
  # pond-adapters-face-onnx, pond-server) to keep compile time reasonable.
  #
  # A pull request from a fork gets no repository secrets, so CARGO_GITHUB_TOKEN is empty there
  # and the private llama-cpp-rs-giap fetch cannot succeed. Failing on a cause the author cannot
  # fix was most of this job's red, so a fork PR skips it. A skipped job reports success, so
  # `rust-fork-notice` fails in its place when the PR changes Rust; require both checks together.
  # Pushes and same-repository PRs still run it, and still fail loudly when the secret is missing.
  rust:
    name: Rust — fmt / clippy / test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      # Reclaim ~25GB on the hosted runner before the heavy goose build, so the
      # production-binary `cargo check` + the rust-cache save step don't ENOSPC.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout pinned Goose submodule
        run: git submodule update --init --recursive --depth=1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo/registry and the build target dir keyed on Cargo.lock.
      # After the first run, unchanged crates are not recompiled.
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        # `update` first: the runner image ships a cached apt index, and when a
        # mirror supersedes a package version the stale index 404s the install
        # (this flaked both PR #188 and #189 on 2026-07-16).
        #
        # protobuf-compiler is for the lightning steps below: breez-sdk-spark
        # pulls spark-token-primitives, whose build script compiles its own
        # .proto files and fails with "Could not find `protoc`" without it. The
        # runner image does not ship one, and a developer machine usually does,
        # which is why this only ever broke in CI.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev protobuf-compiler

      - name: Validate private dependency credential routing
        run: |
          bash -n scripts/ci/git-askpass.sh
          python3 scripts/ci/test_git_askpass.py

      - name: Fetch locked dependencies
        env:
          CARGO_GITHUB_TOKEN: ${{ secrets.CARGO_GITHUB_TOKEN || secrets.GIAP_PRIVATE_FORK_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_ASKPASS: ${{ github.workspace }}/scripts/ci/git-askpass.sh
          GIT_TERMINAL_PROMPT: '0'
          LC_ALL: C
          # Include the path in credential prompts and disable stored helpers.
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.useHttpPath
          GIT_CONFIG_VALUE_0: 'true'
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: ''
        run: |
          if [ -z "$CARGO_GITHUB_TOKEN" ]; then
            echo '::error::CARGO_GITHUB_TOKEN is required with read-only Contents access to jarida-io/llama-cpp-rs-giap. See scripts/ci/README.md.'
            exit 1
          fi
          cargo fetch --locked

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: rustup component add clippy

      - name: cargo clippy (fast crates)
        run: |
          cargo clippy --locked \
            -p pond-voice \
            -p pond-audio \
            -p pond-ear \
            -p pond-core \
            -p pond-infra \
            -p pond-infra-scheduler \
            -p pond-api \
            -p pond-adapters-llamafile \
            -p pond-adapters-ollama \
            -p pond-adapters-whisper \
            -p pond-adapters-matter \
            -p pond-adapters-vision \
            -p pond-adapters-weather \
            -p pond-adapters-uber \
            -p pond-adapters-caldav \
            -p pond-adapters-imap \
            -p pond-adapters-mcp-memory \
            -p pond-mesh-protocol \
            -p pond-mcp-server \
            -p pond-adapters-mistralrs \
            -p pond-hf-cache \
            -p pond-net

      # --ignored is NOT passed so the 28 live-hardware tests are skipped.
      - name: cargo test (fast crates)
        run: |
          cargo test --locked \
            -p pond-voice \
            -p pond-audio \
            -p pond-ear \
            -p pond-core \
            -p pond-infra \
            -p pond-infra-scheduler \
            -p pond-api \
            -p pond-adapters-llamafile \
            -p pond-adapters-ollama \
            -p pond-adapters-whisper \
            -p pond-adapters-matter \
            -p pond-adapters-vision \
            -p pond-adapters-weather \
            -p pond-adapters-uber \
            -p pond-adapters-caldav \
            -p pond-adapters-imap \
            -p pond-adapters-mcp-memory \
            -p pond-mesh-protocol \
            -p pond-mcp-server \
            -p pond-hf-cache \
            -p pond-net

      # Gate the PRODUCTION binary's compilation (pulls the Goose submodule); slow on a cold cache.
      # `--all-targets` is load-bearing: without a target selector cargo builds lib + bins ONLY, so
      # these crates' tests/ and examples/ (excluded from the fast test job) would be compiled by
      # nothing. Not `--tests`: that builds bins in cfg(test) mode and misses `#[cfg(not(test))]`.
      - name: cargo check (production binary + its test targets — pond-server + goose adapter)
        run: cargo check --locked -p pond-server -p pond-adapters-goose --all-targets

      # The check above doesn't pass --features mesh, but the staged sidecar
      # build always does — this catches a mesh-only break the other misses.
      - name: cargo check (production binary with mesh feature — matches the staged sidecar build)
        run: cargo check --locked -p pond-server --features mesh --all-targets

      # The quarantined PondAgent stack (Q2-05). Off pond-server's default features, so the gate
      # above never reaches it, yet AGENTS.md promises it "compiles and can be enabled"; hence
      # `--all-targets` here too. It is off the fast pass because it builds llama-cpp-2.
      - name: cargo check (quarantined PondAgent + its test targets — pond-agent + pond-inference)
        run: cargo check --locked -p pond-agent -p pond-inference --all-targets

      # The direct mistral.rs backend is off by default, so nothing above
      # compiles the ~60 lines in main.rs that wire it. An off-by-default
      # feature nobody checks is how `pond-agent` rotted; this is the same
      # guard, and it only re-checks pond-server itself — the dependency graph
      # is unchanged, so the goose submodule is already built by the step above.
      - name: cargo check (direct mistral.rs backend — off by default, so nothing else builds it)
        run: cargo check --locked -p pond-server --features mistralrs-agent

      # `cargo check --all-targets` above COMPILES pond-inference's tests but never RUNS them.
      # `no_giap_code_calls_llama_backend_init` and
      # `the_backend_handle_is_held_strongly_and_never_freed` guard against a process-wide panic
      # when GIAP and Goose both claim the llama backend; the live embed test is `#[ignore]`d.
      - name: cargo test (in-process GGUF engine + embedder — pond-inference)
        run: cargo test --locked -p pond-inference

      # Compile-gate the ONNX vision classifier (ort is too heavy for the fast
      # lint/test pass, mirroring pond-adapters-face-onnx). Its pure decode/
      # preprocess tests run here too — they need no ONNX Runtime library.
      - name: cargo test (vision classifier — pond-adapters-vision-onnx)
        run: cargo test -p pond-adapters-vision-onnx

      # Isolated like vision-onnx above: full-feature libp2p (kad+gossipsub+relay+dcutr+identify+
      # noise+yamux) is a materially heavier compile than the fast-crates list, and the crate does
      # not touch Goose so it does not belong in the production binary check either.
      - name: cargo clippy (mesh transport — pond-adapters-mesh-libp2p)
        run: cargo clippy -p pond-adapters-mesh-libp2p --all-targets

      - name: cargo test (mesh transport — pond-adapters-mesh-libp2p)
        run: cargo test -p pond-adapters-mesh-libp2p

      # Isolated like mesh-libp2p above — dev-dependencies pull in the full
      # libp2p stack. Previously only type-checked as a side effect of the
      # goose-adapter check, never linted or tested.
      - name: cargo clippy (mesh inference — pond-adapters-mesh-inference)
        run: cargo clippy -p pond-adapters-mesh-inference --all-targets

      - name: cargo test (mesh inference — pond-adapters-mesh-inference)
        run: cargo test -p pond-adapters-mesh-inference

      # Previously compiled by nothing in CI at all. Its one live-network
      # test needs a real BREEZ_API_KEY and stays #[ignore]d, like the other
      # live-hardware tests in the fast job.
      - name: cargo clippy (lightning payment rail — pond-adapters-lightning)
        run: cargo clippy -p pond-adapters-lightning --all-targets

      - name: cargo test (lightning payment rail — pond-adapters-lightning)
        run: cargo test -p pond-adapters-lightning

      # rust-cache saves ~/.cargo/git after this job, and a fork's pull_request run can restore a
      # cache written on this repository's branches. Take the private fork's source out first so
      # no cache carries it; the next run fetches it again with the token.
      - name: Keep the private dependency out of the cache
        if: always()
        run: rm -rf ~/.cargo/git/db/llama-cpp-rs-giap-* ~/.cargo/git/checkouts/llama-cpp-rs-giap-*

  # 2: Frontend ─────────────────────────────────────────────────────────
  # Runs Vitest unit tests and Playwright E2E tests.
  # Playwright spins up the Vite dev server itself (no pond-server process needed —
  # all API calls are intercepted by page.route() mocks in the test files).
  rust-fork-notice:
    name: Rust — skipped on a fork PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Fail when the PR changes Rust
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          rust="$(printf '%s\n' "$files" | grep -E '\.rs$|(^|/)Cargo\.(toml|lock)$|^(crates|vendor|\.cargo)/|^goose$|^Cross\.toml$' || true)"
          if [ -z "$rust" ]; then
            echo "This PR changes no Rust, so the skipped Rust job leaves nothing unverified."
            exit 0
          fi
          printf 'Rust in this PR:\n%s\n' "$rust"
          echo "::error title=Rust not verified on this PR::$HEAD_REPO is a fork, and fork PRs get no CARGO_GITHUB_TOKEN, so the private jarida-io/llama-cpp-rs-giap dependency cannot be fetched. Push the branch to jarida-io/goose-in-a-pond to run the Rust checks before merging. See scripts/ci/README.md."
          exit 1

  matter-server:
    name: Matter controller — tsc / vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matter-server
    steps:
      - uses: actions/checkout@v7

      # 20.19 is matter.js's floor and the one server_setup.rs enforces at
      # runtime, so CI builds against the oldest Node a Pond may have rather
      # than the newest the runner offers.
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: matter-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The controller runs under tsx with no build step, so nothing else would
      # ever type-check it.
      - name: Typecheck
        run: npx tsc --noEmit

      # The cluster mappings are pure functions over recorded devices: no
      # fabric, no hardware, no network.
      - name: Vitest (unit tests)
        run: npx vitest run

  # The music extension is TypeScript run by tsx, so nothing in the Rust or desktop jobs compiles or
  # tests it. Its tests use fakes and a fake network; the ones that drive the real Music app
  # (GIAP_MUSIC_LIVE) are skipped here, and would have no Music app to drive on this runner.
  music-extension:
    name: Music extension - typecheck / tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/music
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/music/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  # The Node setup in scripts/giap.sh (`giap.sh node`) decides which Node every developer builds on
  # and can download one, so it is tested like code: the range, the checksum check, the download and
  # its refusals, against a fake nodejs.org. Nothing here touches the network or the runner's home.
  node-setup:
    name: Node setup script - bash tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tests
        run: bash scripts/lib/node-setup.test.sh

  # scripts/jetson/deploy.sh reaches the Jetson through scripts/lib/jetson-remote.sh: one pinned
  # address per deploy, a detached build it follows, and retries on a lost connection.
  jetson-remote:
    name: Jetson deploy connection - bash tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tests
        run: bash scripts/lib/jetson-remote.test.sh

  # The vision pairing generator (`giap.sh models pairings`) writes a file pond-core embeds, so it is
  # tested like code and offline: recorded Hugging Face listings, GGUF headers built by the tests, and
  # giap.sh's wiring against a fake python3. The weekly refresh itself is model-pairings.yml.
  model-pairings:
    name: Vision pairing generator - unit and bash tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generator unit tests
        run: python3 -m unittest discover -s scripts/models -p 'test_*.py' -v

      - name: Bash tests
        run: bash scripts/lib/model-pairings.test.sh

  # The printed setup card's tooling (scripts/lib/setup-code.sh): the doctor line, the card made at
  # install, and provision fetching it over ssh, against a fake pond-server and a fake ssh.
  setup-code:
    name: Setup card scripts - bash tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tests
        run: bash scripts/lib/setup-code.test.sh

  # Every shell script outside the goose/ submodule. Most of them run on the Jetson or a server and
  # no test can exercise them here, so this is the only check they get. A warning fails the job; a
  # note is printed and does not. The root .shellcheckrc makes it follow sourced files.
  #
  # The release binary, pinned and checksummed, not the runner's apt package: that one is older,
  # lacks checks this one has, and so would disagree with what a developer sees locally.
  shellcheck:
    name: Shell scripts - shellcheck
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          set -euo pipefail
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Notes (reported, never fail the job)
        run: |
          git ls-files -z '*.sh' ':!:goose/' | xargs -0 shellcheck --format=gcc | grep ': note:' || true

      - name: Warnings and errors
        run: |
          shellcheck --version
          git ls-files -z '*.sh' ':!:goose/' | xargs -0 shellcheck --severity=warning

  frontend:
    name: Frontend — vitest / playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pond-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22, not 20: vitest 5 declares `^22.12.0 || ^24.0.0 || >=26.0.0` and this job runs it, so
          # 20 was below the package's own stated minimum. .nvmrc and package.json's `engines` say
          # the same; scripts/giap.sh node is what gets a developer onto it.
          node-version: 22
          cache: npm
          cache-dependency-path: pond-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # Nothing in this job launches Electron, and setup-node's npm cache
          # does not cover ~/.cache/electron — so skip the ~100 MB download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # Vite builds with esbuild, which strips types without checking them, so
      # until this step existed nothing type-checked pond-desktop/dist — the
      # very artifact pond-api embeds with include_dir!.
      - name: Typecheck
        run: npm run typecheck

      # Every rule eslint.config.js enables is an error and fails the job; docs/CONTRIBUTING.md
      # lists the rules that are off.
      - name: ESLint
        run: npm run lint

      - name: Vitest (unit tests)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright (E2E tests)
        run: npx playwright test

  # A headless launch of the real Electron main process. This is the successor
  # to `cargo test --manifest-path pond-desktop/src-tauri/...`, which nothing
  # ever ran -- except that this one exercises the parts that command could
  # not: the window actually opening, the app:// protocol handler serving the
  # bundle, and the preload publishing exactly the contract's surface.
  #
  # Honest about its limits. On ubuntu under xvfb this does NOT prove: the
  # macOS menu (so not the clipboard), any TCC prompt, a real microphone, a
  # real sidecar, the .dmg, or that the tray icon is visible rather than
  # merely constructed. Those are in the manual runbook and stay there.
  desktop-smoke:
    name: Desktop — headless launch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pond-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22, not 20, because that is Electron's own floor: electron@44
          # declares `engines: { node: ">= 22.12.0" }`, so running these jobs
          # on 20 was below the package's stated minimum. It also gives the
          # smoke script a global WebSocket, which Node gained in 22 and which
          # it needs to speak the devtools protocol.
          node-version: 22
          cache: npm
          cache-dependency-path: pond-desktop/package-lock.json

      # setup-node's npm cache does not cover Electron's own binary, which
      # lands in ~/.cache/electron. Without this the ~100 MB download happens
      # on every run; keyed on the lockfile so it only misses on a real bump.
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pond-desktop/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build the renderer and the main process
        run: npm run build && npm run build:main

      # Two separate things have to be true before Electron will start here.
      #
      # 1. The binary must actually be extracted. `npm ci` does not reliably
      #    leave node_modules/electron/dist populated on this runner -- the
      #    first run fetched it lazily, during the smoke step. So force it now,
      #    while there is still something that can report a clear failure.
      #
      # 2. The SUID sandbox helper must be root-owned and mode 4755, which npm
      #    cannot do. Chromium refuses to start rather than quietly drop the
      #    sandbox: "The SUID sandbox helper binary was found, but is not
      #    configured correctly. Rather than run without sandboxing I'm
      #    aborting now."
      #
      # Fixing the ownership rather than passing --no-sandbox, deliberately:
      # --no-sandbox would make this job green while exercising a
      # configuration nobody ships, and would stop the smoke test ever
      # noticing if the sandbox broke for real.
      - name: Prepare Electron and its sandbox helper
        run: |
          set -euo pipefail
          # Electron 44's npm package has NO postinstall script -- check its
          # package.json, there is no `scripts` field at all. Extraction is
          # explicit, through the `install-electron` bin it declares. So
          # `npm ci` legitimately leaves node_modules/electron/dist empty, and
          # `npm rebuild electron` does nothing because there is nothing to
          # rebuild. Verified both locally.
          #
          # Extract it here, without running it. The ordering is circular if
          # you get it wrong: the binary will not start until the sandbox
          # helper is root-owned, and the helper does not exist until the
          # binary is extracted. `npx electron --version` is not a way out --
          # it goes far enough into Chromium startup to hit the very same
          # FATAL:setuid_sandbox_host.cc abort.
          npx install-electron
          SANDBOX=node_modules/electron/dist/chrome-sandbox
          if [ ! -f "$SANDBOX" ]; then
            echo "::error::expected $SANDBOX to exist after preparing Electron"
            ls -la node_modules/electron/dist 2>/dev/null | head -20 || echo "(no dist directory at all)"
            exit 1
          fi
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          ls -l "$SANDBOX"

      - name: Launch headless and assert the bridge
        run: xvfb-run -a node scripts/smoke.mjs

  # ── Live test ──────────────────────────────────────────────────────────────
  #
  # CLAUDE.md calls this required for any change touching a migration, a route,
  # a handler or startup wiring, and nothing in CI has ever run it. Every Rust
  # test above builds its database by applying every migration to an empty file,
  # in one process, with the adapter constructed by hand -- so none of them
  # exercises startup ordering, migrations against a database that already has
  # rows, route registration, auth middleware, or the wiring in main.rs. That is
  # where several real defects have been.
  #
  # It is gated twice, because it is slow and because it cannot always run.
  live-test-gate:
    name: Live test — gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - id: decide
        # The secret is read here rather than in an `if:`, because the secrets
        # context is not available to job-level conditions.
        env:
          HAS_TOKEN: ${{ secrets.CARGO_GITHUB_TOKEN != '' || secrets.GIAP_PRIVATE_FORK_TOKEN != '' }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # cargo resolves the whole workspace before building any member, and
          # pond-adapters-local-inference takes llama-cpp-2 from the private
          # jarida-io/llama-cpp-rs-giap. Without a credential nothing in this
          # workspace compiles -- which is also why `Rust — fmt / clippy / test`
          # is red. Skip rather than add a fifth permanently-failing check.
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live test skipped::CARGO_GITHUB_TOKEN (or legacy GIAP_PRIVATE_FORK_TOKEN) is not set, so cargo cannot fetch jarida-io/llama-cpp-rs-giap. Add the secret to enable this job."
            exit 0
          fi

          # A cold build here compiles Goose and llama.cpp, so it is not worth
          # paying on a change it cannot say anything about. These are the paths
          # CLAUDE.md names: migrations, routes, handlers, startup wiring.
          if [ -z "${BASE:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0   # push to a trunk branch
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD || true)
          if echo "$CHANGED" | grep -qE '^(crates/pond-infra/migrations/|crates/pond-api/src/routes\.rs|crates/pond-server/src/|scripts/live-test\.sh|scripts/live_checks\.py|tests/e2e-live/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live test skipped::No migration, route, handler or startup-wiring change in this diff."
          fi

  live-test:
    name: Live test — HTTP against a server that really started
    needs: live-test-gate
    if: needs.live-test-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Same packages as the Rust job; alsa-sys in pond-server's build needs libasound2-dev.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev protobuf-compiler

      - name: Validate private dependency credential routing
        run: |
          bash -n scripts/ci/git-askpass.sh
          python3 scripts/ci/test_git_askpass.py

      - name: Fetch locked dependencies
        env:
          CARGO_GITHUB_TOKEN: ${{ secrets.CARGO_GITHUB_TOKEN || secrets.GIAP_PRIVATE_FORK_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_ASKPASS: ${{ github.workspace }}/scripts/ci/git-askpass.sh
          GIT_TERMINAL_PROMPT: '0'
          LC_ALL: C
          # Include the path in credential prompts and disable stored helpers.
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.useHttpPath
          GIT_CONFIG_VALUE_0: 'true'
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: ''
        run: |
          if [ -z "$CARGO_GITHUB_TOKEN" ]; then
            echo '::error::CARGO_GITHUB_TOKEN is required with read-only Contents access to jarida-io/llama-cpp-rs-giap. See scripts/ci/README.md.'
            exit 1
          fi
          cargo fetch --locked

      # live-test.sh drives the dashboard the server actually serves when asked
      # for --ui; without Node it still runs every HTTP assertion.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pond-desktop/package-lock.json

      # A scratch POND_DATA_DIR, a mock chat model, and the loopback bypass off
      # for the auth phase are all the script's own doing -- see its header.
      - name: scripts/live-test.sh
        run: bash scripts/live-test.sh

      # rust-cache saves ~/.cargo/git after this job, and a fork's pull_request run can restore a
      # cache written on this repository's branches. Take the private fork's source out first so
      # no cache carries it; the next run fetches it again with the token.
      - name: Keep the private dependency out of the cache
        if: always()
        run: rm -rf ~/.cargo/git/db/llama-cpp-rs-giap-* ~/.cargo/git/checkouts/llama-cpp-rs-giap-*

  # Packages a real .app and checks its shape. Gated to manual dispatch and
  # tags ONLY: macOS runners bill at 10x, and nothing here changes often
  # enough to justify that per PR. It also fabricates a tiny Mach-O in place
  # of pond-server rather than building the real one -- a clean release build
  # of the server is ~35 minutes, and this job is testing the packaging, not
  # the server.
  desktop-package:
    name: Desktop — package (macOS)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    defaults:
      run:
        working-directory: pond-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Electron's declared floor — see the note in desktop-smoke.
          node-version: 22
          cache: npm
          cache-dependency-path: pond-desktop/package-lock.json

      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pond-desktop/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build the renderer and the main process
        run: npm run build && npm run build:main

      - name: Stand in a Mach-O for the sidecar
        run: |
          mkdir -p resources
          printf '#include <stdio.h>\nint main(void){puts("stub");return 0;}\n' > /tmp/stub.c
          cc -o resources/pond-server /tmp/stub.c
          bash ../scripts/lib/dist-stamp.sh dist > resources/.dist-stamp
          bash ../scripts/verify-sidecar.sh

      - name: Package
        run: npx electron-builder --mac dir

      # These four assertions are the whole point of the job. The plist one in
      # particular guards a key whose absence is a SIGKILL rather than a
      # refused permission -- see the comment in electron-builder.yml.
      - name: Assert the bundle's shape
        run: |
          APP="release/mac-arm64/Goose In A Pond.app"
          test -x "$APP/Contents/Resources/pond-server"
          test -f "$APP/Contents/Resources/matter-server/package.json"
          test -f "$APP/Contents/Resources/matter-server/vendor/find-yarn-workspace-root/index.cjs"
          test -f "$APP/Contents/Resources/matter-server/vendor/find-yarn-workspace-root/LICENSE"
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Contents/Info.plist"
          plutil -extract NSBluetoothAlwaysUsageDescription raw "$APP/Contents/Info.plist"

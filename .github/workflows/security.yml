# Security scanning — three independent jobs: rust-audit (RustSec scan of Cargo.lock; no build,
# no goose submodule), npm-audit (pond-desktop tree, fails on high/critical) and secrets
# (gitleaks over the FULL git history). Runs on every PR/push to main, weekly (advisories
# published after merge), and on demand.

name: Security

on:
  pull_request:
    branches: [main, hardening]
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 06:17 UTC — catches newly published advisories against
    # unchanged lockfiles. Odd minute avoids the top-of-hour thundering herd.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Superseded runs are not worth finishing: a second push to the same branch
# makes the first scan's answer about a tree nobody will merge.
concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-audit:
    name: Rust — cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary — installs in seconds vs minutes for cargo install.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.87.11
        with:
          tool: cargo-audit

      # Fails the job on any vulnerability advisory affecting the lockfile
      # (unmaintained/unsound surface as warnings). There is one cargo project
      # in this repo now: the desktop shell used to be a second, separate one
      # under pond-desktop and needed its own audit step.
      - name: cargo audit (workspace)
        run: cargo audit

  # Now the desktop shell's only dependency audit: its tree is npm, and it
  # carries Electron itself.
  npm-audit:
    name: Frontend — npm audit (high+)
    runs-on: ubuntu-latest
    strategy:
      # Do not stop at the first failing tree — report every one in a single run.
      fail-fast: false
      matrix:
        # Every npm lockfile in the repo. Add new ones here.
        project: [pond-desktop, extensions/music]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      # `npm audit` needs only the lockfile; fail on high/critical advisories.
      - name: npm audit
        run: npm audit --audit-level=high

  osv:
    name: All lockfiles — OSV (GitHub Advisory ranges)
    runs-on: ubuntu-latest
    # Advisory, not blocking, deliberately: osv-scanner exits non-zero on ANY advisory at ANY
    # severity and this tree cannot reach zero (rsa RUSTSEC-2023-0071 and ttf-parser
    # RUSTSEC-2026-0192 have no fix; quick-xml and scc need semver-major bumps inside goose). Drop
    # `continue-on-error` once `osv-scanner.toml` has a reviewed `[[IgnoredVulns]]` entry for each.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      # Alongside cargo audit because cargo-audit reads only the RustSec database while Dependabot
      # reads GitHub's, whose ranges are sometimes wider; osv-scanner queries OSV.dev, which
      # aggregates both (cargo-deny would not: same RustSec data). Lockfiles are named explicitly
      # so vendor/temporal_rs and templates/extensions/rust do not add noise; add new ones here.
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=pond-desktop/package-lock.json
            --lockfile=extensions/music/package-lock.json

  secrets:
    name: Secrets — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. Both modes below need it: the full scan obviously, and
          # the PR scan because a commit RANGE cannot be resolved from a shallow
          # clone that does not contain the base.
          fetch-depth: 0
          submodules: false

      # Pinned gitleaks CLI via the official image (the GitHub Action needs an org license).
      # A pull request asks "does this change introduce a secret", so it scans only the PR's
      # commits: a full-history scan grows with the repository's age, not the change. Pushes to
      # main and the weekly run still read everything, which is where the guarantee lives.
      - name: gitleaks — the commits this PR adds
        if: github.event_name == 'pull_request'
        env:
          # Through the environment, not interpolated into the script. These are
          # hex SHAs today, but `run:` interpolation of anything from the event
          # payload is the shape of a shell-injection bug and is worth not
          # writing even when the value is safe.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # gitleaks FAILS OPEN on a range it cannot resolve: given a malformed `--log-opts` it
          # prints "failed to scan Git repository", then "no leaks found", and exits 0. So both
          # halves are checked here rather than trusted.
          test -n "$BASE_SHA" -a -n "$HEAD_SHA" || {
            echo "::error::empty base/head SHA — refusing to report a pass on a scan that cannot run"
            exit 1
          }

          out=$(docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --no-banner --redact --exit-code 1 \
            --log-opts "$BASE_SHA..$HEAD_SHA" 2>&1) && status=0 || status=$?
          echo "$out"

          if grep -qi "failed to scan" <<<"$out"; then
            echo "::error::gitleaks could not scan the range $BASE_SHA..$HEAD_SHA"
            exit 1
          fi
          exit "$status"

      - name: gitleaks — full history
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --no-banner --redact --exit-code 1

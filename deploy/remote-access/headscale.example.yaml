# Copy into runtime/headscale.yaml and replace the public domain before deployment.
server_url: https://headscale.example.invalid
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
noise:
  private_key_path: /var/lib/headscale/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
derp:
  server:
    enabled: true
    region_id: 999
    region_code: goose
    region_name: Goose relay
    verify_clients: true
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_private.key
    automatically_add_embedded_derp_region: true
  urls: []
  paths: []
  auto_update_enabled: false
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
policy:
  mode: database
dns:
  magic_dns: false
  base_domain: nodes.example.invalid
  override_local_dns: false
  nameservers:
    global: []
log:
  level: warn
  format: json
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: '0600'
disable_check_updates: true
